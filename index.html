async function removeAccount(id) {
  if (id === currentUser.id) return alert('Không thể xóa tài khoản của chính bạn.');
  if (!confirm('Bạn có chắc muốn xóa tài khoản này?')) return;
  accounts = accounts.filter(a => a.id !== id);
  await supabaseClient.from('accounts').delete().eq('id', id);
  openAdmin('accounts');
}

async function saveItem() {
  const type = document.getElementById('itemType').value;
  const name = document.getElementById('itemName').value.trim();
  const unit = document.getElementById('itemUnit').value.trim();
  const opening = normalizeQty1(document.getElementById('itemOpening')?.value || 0);

  if (!name || !unit) return alert('Vui lòng nhập Tên mặt hàng và Đơn vị tính.');
  const arr = type === 'raw' ? raw : fg;

  if (editingItemId) {
    const item = arr.find(x => x.id === editingItemId);
    if (item) {
      item.name = name;
      item.unit = unit;
      item.opening = opening;
      if (type === 'raw') {
        item.group = document.getElementById('itemGroup').value;
      } else {
        item.category = document.getElementById('itemCat').value;
      }
      await syncItemToSupabase(type, item);
    }
    editingItemId = null;
  } else {
    if (arr.some(x => x.name.trim().toLowerCase() === name.toLowerCase())) {
      return alert('Mặt hàng này đã có trong danh mục.');
    }

    let newItem;
    if (type === 'raw') {
      const group = document.getElementById('itemGroup').value;
      newItem = { id: 'r_' + Date.now(), name, unit, group, opening, imported: 0, exported: 0, unit_cost: 0, conversion_unit: '', conversion_qty: 0, usage_per_product: 0, waste_qty: 0, sort_order: (raw.reduce((m,x)=>Math.max(m, Number(x.sort_order)||0),0) || raw.length*10) + 10 };
      raw.push(newItem);
    } else {
      const category = document.getElementById('itemCat').value;
      newItem = { id: 'f_' + Date.now(), name, unit, category, opening, sales: 0, production: 0, returned: 0, waste: 0, sort_order: (fg.reduce((m,x)=>Math.max(m, Number(x.sort_order)||0),0) || fg.length*10) + 10 };
      fg.push(newItem);
    }
    await syncItemToSupabase(type, newItem);
  }

  openAdmin('items');
}

async function deleteItem(type, id) {
  const arr = type === 'raw' ? raw : fg;
  const x = arr.find(z => z.id === id);
  if (!x) return;
  if (!confirm(`Xóa hẳn mặt hàng “${x.name}” khỏi danh mục?`)) return;

  if (type === 'raw') raw = raw.filter(z => z.id !== id);
  else fg = fg.filter(z => z.id !== id);

  const table = type === 'raw' ? 'raw_items' : 'fg_items';
  await supabaseClient.from(table).delete().eq('id', id);
  openAdmin('items');
}


// ===== LEDGER: nguồn sự thật cho tồn kho khi SỬA/XÓA nhật ký =====
function isOwnerRole() {
  return ['admin', 'owner'].includes(String(currentUser?.role || '').toLowerCase());
}
function canDeleteAnyLog() {
  return isOwnerRole();
}
function logTimestamp(log, fallbackIndex = 0) {
  // Log thực tế có timestamp dạng Unix milliseconds; phải ưu tiên trường này.
  const timestamp = Number(log?.timestamp);
  if (Number.isFinite(timestamp) && timestamp > 0) return timestamp;

  const raw = log?.createdAt || log?.created_at || log?.time;
  const t = raw ? Date.parse(raw) : NaN;
  return Number.isFinite(t) ? t : fallbackIndex;
}
function normalizeActionType(log) {
  if (log.actionType) return log.actionType;
  const a = String(log.action || '');
  if (a === 'Nhập' || a === 'Nhập kho') return 'import';
  if (a === 'Xuất' || a === 'Xuất kho') return 'export';
  if (a === 'Xuất bán') return 'sales';
  if (a === 'Nấu thêm') return 'production';
  if (a === 'Thu hồi' || a === 'Thu hồi cuối ngày') return 'return';
  if (a === 'Hủy món') return 'waste';
  // Dữ liệu điều chỉnh cũ được coi là sự kiện kiểm kê để không làm mất lịch sử.
  // Tương thích dữ liệu cũ: các bản ghi "Điều chỉnh" cũ được đọc như một
  // mốc Kiểm kê; từ phiên bản này không tạo thêm loại giao dịch Điều chỉnh.
  if (a === 'Điều chỉnh tăng' || a === 'Điều chỉnh giảm' || log.actionType === 'adjustment') return 'stocktake';
  if (a === 'Kiểm kê' || log.actionType === 'stocktake') return 'stocktake';
  if (a === 'Sửa dữ liệu lỗi cũ') return 'data_repair';
  return null;
}
function applyLedgerMovement(tab, state, type, qty) {
  const n = Number(qty);
  if (!Number.isFinite(n) || n <= 0) return false;
  if (tab === 'raw') {
    if (type === 'import') state.imported += n;
    else if (type === 'export') state.exported += n;
    else return false;
  } else {
    if (type === 'sales') state.sales += n;
    else if (type === 'production') state.production += n;
    else if (type === 'return') state.returned += n;
    else if (type === 'waste') state.waste += n;
    else return false;
  }
  return true;
}

function ledgerStock(tab, state) {
  return tab === 'raw'
    ? Number(state.opening || 0) + Number(state.imported || 0) - Number(state.exported || 0)
    : Number(state.opening || 0) + Number(state.production || 0) - Number(state.sales || 0) + Number(state.returned || 0) - Number(state.waste || 0);
}

function simulateItemLedger(tab, item, overrideLogId = null, overrideQty = null, deletedLogId = null) {
  const itemLogs = logs
    .map((l, idx) => ({ l, idx, ts: logTimestamp(l, idx) }))
    .filter(o => logBelongsToItem(o.l, tab, item) && o.l.id !== deletedLogId)
    .sort((a,b) => a.ts - b.ts || a.idx - b.idx);

  // Ledger mô phỏng phải dùng ĐÚNG cùng một quy tắc với Ledger hiển thị:
  // lấy Kiểm kê gần nhất làm mốc gốc, sau đó chạy tuần tự từng giao dịch.
  // Khi sửa một log, log cũ được thay bằng số mới ngay tại đúng vị trí thời gian;
  // tuyệt đối không lấy tồn hiện tại rồi trừ/cộng lại số mới.
  let stock = Number(item?.opening || 0);
  if (!Number.isFinite(stock) || stock < 0) stock = 0;

  // Tìm mốc kiểm kê cuối cùng. Các giao dịch trước mốc này không còn ảnh hưởng
  // tới tồn hiện tại, đúng với calculateStockFromLogs().
  let startIndex = 0;
  for (let i = itemLogs.length - 1; i >= 0; i--) {
    const l = itemLogs[i].l;
    if (normalizeActionType(l) !== 'stocktake') continue;
    const target = Number(l.after);
    if (!Number.isFinite(target) || target < 0) continue;
    stock = target;
    startIndex = i + 1;
    break;
  }

  const state = {
    opening: stock,
    imported: 0, exported: 0, production: 0, sales: 0, returned: 0, waste: 0
  };
  const results = [];

  for (let i = startIndex; i < itemLogs.length; i++) {
    const l = itemLogs[i].l;
    const type = normalizeActionType(l);

    if (type === 'data_repair') continue;

    const isOverride = l.id === overrideLogId;
    const qty = isOverride ? Number(overrideQty) : Number(l.qty);

    // Kiểm kê không được sửa qua màn hình này, nhưng vẫn phải được mô phỏng
    // như một mốc tồn thực tế nếu nó nằm trong lịch sử.
    if (type === 'stocktake') {
      const target = Number(l.after);
      if (!Number.isFinite(target) || target < 0) {
        return { ok:false, message:`Nhật ký kiểm kê của ${item.name} có Tồn thực tế không hợp lệ.` };
      }
      const before = stock;
      stock = target;
      results.push({ id:l.id, before, after:stock });
      continue;
    }

    if (!type || !Number.isFinite(qty) || qty < 0) {
      return { ok:false, message:`Nhật ký "${l.action}" của ${item.name} có số lượng không hợp lệ.` };
    }

    const before = stock;
    const decreasing = tab === 'raw' ? type === 'export' : ['sales','waste'].includes(type);

    // qty = 0 chỉ được phép đối với chính log đang sửa. Nó vẫn đi qua Ledger
    // như một giao dịch hợp lệ để kiểm tra toàn bộ chuỗi phía sau.
    if (decreasing && qty > before + 1e-9) {
      return {
        ok:false,
        message:`Không thể sửa vì "${l.action}" ${fmt(qty)} ${item.unit} làm tồn kho âm. Tồn khả dụng tại thời điểm đó chỉ ${fmt(Math.max(0,before))} ${item.unit}.`
      };
    }

    // Tính trực tiếp từ stock hiện tại thay vì dựng lại từ các tổng trên item.
    // Đây là điểm quan trọng giúp sửa 10 → 8 thành 0 + 10 - 8 = 2.
    if (tab === 'raw') {
      if (type === 'import') { stock += qty; state.imported += qty; }
      else if (type === 'export') { stock -= qty; state.exported += qty; }
      else return { ok:false, message:`Không xác định được loại giao dịch của nhật ký "${l.action}".` };
    } else {
      if (type === 'production') { stock += qty; state.production += qty; }
      else if (type === 'sales') { stock -= qty; state.sales += qty; }
      else if (type === 'return') { stock += qty; state.returned += qty; }
      else if (type === 'waste') { stock -= qty; state.waste += qty; }
      else return { ok:false, message:`Không xác định được loại giao dịch của nhật ký "${l.action}".` };
    }

    if (stock < -1e-9) {
      return {
        ok:false,
        message:`Không thể sửa vì "${l.action}" ${fmt(qty)} ${item.unit} làm tồn kho âm. Tồn khả dụng tại thời điểm đó chỉ ${fmt(Math.max(0,before))} ${item.unit}.`
      };
    }

    results.push({ id:l.id, before, after:stock });
  }

  return { ok:true, state, results, stock };
}

function rebuildItemLedger(tab, item) {
  const sim = simulateItemLedger(tab, item);
  if (!sim.ok) return sim;

  item.imported = sim.state.imported;
  item.exported = sim.state.exported;
  item.production = sim.state.production;
  item.sales = sim.state.sales;
  item.returned = sim.state.returned;
  item.waste = sim.state.waste;

  const byId = new Map(sim.results.map(r => [r.id, r]));
  logs.forEach(l => {
    if (l.tab === tab && l.itemId === item.id && byId.has(l.id)) {
      const r = byId.get(l.id);
      l.before = r.before;
      l.after = r.after;
      l.actionType = normalizeActionType(l);
    }
  });
  return sim;
}
function saveLocalState() {
  localStorage.setItem('awan_logs_backup', JSON.stringify(logs));
  localStorage.setItem('awan_raw_backup', JSON.stringify(raw));
  localStorage.setItem('awan_fg_backup', JSON.stringify(fg));
}

// SỬA / XÓA NHẬT KÝ THEO PHÂN QUYỀN
function canEditLog(l) {
  if (!currentUser) return false;
  const role = String(currentUser.role || '').toLowerCase();
  if (['admin','owner','manager'].includes(role)) return true;

  // Nhân viên chỉ được sửa nhật ký do chính tài khoản đó tạo.
  const logUserId = String(l.userId || '').trim();
  const logUsername = String(l.username || '').trim();
  const currentId = String(currentUser.id || '').trim();
  const currentUsername = String(currentUser.username || '').trim();
  if (logUserId && currentId) return logUserId === currentId;
  if (logUsername && currentUsername) return logUsername === currentUsername;
  return false;
}

function editLog(id) {
  if (isDateFilterActive()) {
    showInventoryNotice('📅 Đang xem báo cáo', 'Bạn đang ở chế độ xem lại theo ngày. Hãy bấm “Về hiện tại” trước khi sửa nhật ký.');
    return;
  }
  const l = logs.find(x => x.id === id);
  if (!l) return;
  if (!canEditLog(l)) return alert('Bạn không có quyền sửa nhật ký do người khác tạo.');
  if (normalizeActionType(l) === 'stocktake') return alert('Nhật ký kiểm kê không sửa trực tiếp. Nếu nhập sai, Owner/Admin có thể xóa nhật ký kiểm kê và thực hiện kiểm kê lại.');

  editLogId = id;
  openModal(`
    <h2 style="font-size:18px">✏ Sửa nhật ký giao dịch</h2>
    <div class="notice-box" style="margin-top:10px">${l.action} - <b>${l.item}</b><br>Tạo bởi: <b>${l.user}</b><br>Số lượng hiện tại: <b style="font-size:16px">${fmt(l.qty)} ${l.unit}</b></div>
    <div class="form-group"><label>Số lượng mới</label><input id="editAmount" type="number" min="0" step="0.1" value="${l.qty}"></div>
    <div class="modal-buttons"><button class="btn-cancel" onclick="closeModal()">Hủy</button><button class="btn-save" onclick="saveLogEdit()">Lưu thay đổi</button></div>
  `);
}

async function saveLogEdit() {
  const l = logs.find(x => x.id === editLogId);
  const n = Number(document.getElementById('editAmount')?.value);
  if (!l || !Number.isFinite(n) || n < 0) return showInventoryNotice('⚠️ Số lượng không hợp lệ', 'Số lượng mới phải từ 0 trở lên. Dữ liệu chưa được lưu.');
  if (!canEditLog(l)) return showInventoryNotice('⚠️ Không có quyền', 'Bạn không có quyền sửa nhật ký này.');
  if (normalizeActionType(l) === 'stocktake') {
    return showInventoryNotice('🧾 Nhật ký kiểm kê', 'Nhật ký kiểm kê không sửa trực tiếp. Nếu nhập sai, Owner/Admin có thể xóa nhật ký và thực hiện kiểm kê lại.');
  }

  const arr = l.tab === 'raw' ? raw : fg;
  const x = arr.find(z => z.id === l.itemId);
  if (!x) return showInventoryNotice('❌ Không tìm thấy mặt hàng', 'Mặt hàng không còn trong danh mục.');

  const oldQty = Number(l.qty || 0);
  const oldAfter = l.after;
  const oldEditedAt = l.editedAt;
  const oldEditedBy = l.editedBy;
  const oldEditDetail = l.editDetail || '';
  const originalItem = JSON.parse(JSON.stringify(x));

  // Dựng lại toàn bộ Ledger với số lượng mới. Nếu bất kỳ thời điểm nào
  // bị âm, chặn ngay trước khi ghi Cloud.
  const sim = simulateItemLedger(l.tab, x, l.id, n);
  if (!sim.ok) {
    return showInventoryNotice(
      '⚠️ KHÔNG THỂ SỬA NHẬT KÝ',
      `${sim.message}\n\nDữ liệu chưa được lưu.`
    );
  }

  const resultMap = new Map(sim.results.map(r => [r.id, r]));
  const newAfter = resultMap.get(l.id)?.after ?? l.after;
  const editedAt = dateTime();
  const editedBy = currentUser.name;
  const editDetail = `Số lượng: ${fmt(oldQty)} ${l.unit} → ${fmt(n)} ${l.unit}`;

  const updatedItem = JSON.parse(JSON.stringify(x));
  // Chỉ ghi các cột giao dịch thực sự tồn tại trên từng bảng.
  // raw_items: imported, exported
  // fg_items: production, sales, returned, waste
  // Không gửi exported/imported vào fg_items (hoặc production/... vào raw_items).
  if (l.tab === 'raw') {
    updatedItem.imported = sim.state.imported;
    updatedItem.exported = sim.state.exported;
  } else {
    updatedItem.production = sim.state.production;
    updatedItem.sales = sim.state.sales;
    updatedItem.returned = sim.state.returned;
    updatedItem.waste = sim.state.waste;
  }

  const confirmed = await showInventoryConfirm(
    '⚠️ XÁC NHẬN SỬA NHẬT KÝ',
    `Bạn có chắc chắn muốn sửa nhật ký “${l.action}” của ${l.item}?\n\nSố lượng: ${fmt(oldQty)} ${l.unit} → ${fmt(n)} ${l.unit}\nTồn sau giao dịch: ${fmt(newAfter)} ${l.unit}\n\nHệ thống sẽ kiểm tra lại toàn bộ Ledger của mặt hàng trước khi lưu.`
  );
  if (!confirmed) return;

  try {
    const table = l.tab === 'raw' ? 'raw_items' : 'fg_items';

    const { error: itemError } = await supabaseClient.from(table).upsert(updatedItem);
    if (itemError) throw new Error(`Không thể cập nhật tồn kho Cloud: ${itemError.message || itemError}`);

    const { error: logError } = await supabaseClient.from('logs').update({
      qty: n,
      before: Number(resultMap.get(l.id)?.before ?? l.before ?? 0),
      after: Number(newAfter),
      actiontype: normalizeActionType(l),
      editedat: editedAt,
      editedby: editedBy,
      ...(l.tab === 'raw' && normalizeActionType(l) === 'export' ? { yieldqty: Math.round((Math.max(0, logConversionQty(l) - logWasteQty(l)) / Math.max(0.000001, logUsagePerProduct(l))) * n) } : {}),
    }).eq('id', l.id);
    if (logError) {
      await supabaseClient.from(table).upsert(originalItem);
      throw new Error(`Không thể cập nhật Nhật Ký Cloud: ${logError.message || logError}`);
    }

    Object.assign(x, updatedItem);
    l.qty = n;
    l.before = Number(resultMap.get(l.id)?.before ?? l.before ?? 0);
    l.after = Number(newAfter);
    l.actionType = normalizeActionType(l);
    l.editedAt = editedAt;
    l.editedBy = editedBy;
    l.editDetail = editDetail;
    if (l.tab === 'raw' && normalizeActionType(l) === 'export') l.yieldQty = Math.round((Math.max(0, logConversionQty(l) - logWasteQty(l)) / Math.max(0.000001, logUsagePerProduct(l))) * n);

    // Cập nhật lại before/after trên các Log phía sau trong bộ nhớ để
    // Ledger hiển thị nhất quán ngay lập tức.
    logs.forEach(log => {
      if (log.tab === l.tab && log.itemId === l.itemId && resultMap.has(log.id)) {
        const r = resultMap.get(log.id);
        log.before = r.before;
        log.after = r.after;
      }
    });

    saveLocalState();
    closeModal();
    render();
    showSuccessToast('Đã sửa nhật ký và kiểm tra lại toàn bộ Ledger');
  } catch (err) {
    Object.assign(x, originalItem);
    l.qty = oldQty;
    l.after = oldAfter;
    l.editedAt = oldEditedAt;
    l.editedBy = oldEditedBy;
    l.editDetail = oldEditDetail;
    return showInventoryNotice(
      '❌ SỬA NHẬT KÝ KHÔNG THÀNH CÔNG',
      `${err.message || err}\n\nDữ liệu trên màn hình đã được giữ nguyên.`
    );
  }
}

async function deleteLog(id) {
  if (isDateFilterActive()) {
    showInventoryNotice('📅 Đang xem báo cáo', 'Bạn đang ở chế độ xem lại theo ngày. Hãy bấm “Về hiện tại” trước khi xóa nhật ký.');
    return;
  }
  if (!['admin','owner'].includes(String(currentUser?.role || '').toLowerCase())) {
    return alert('Chỉ tài khoản Admin/Owner mới có quyền xóa nhật ký.');
  }

  const l = logs.find(x => x.id === id);
  if (!l) return alert('Không tìm thấy nhật ký.');

  const arr = l.tab === 'raw' ? raw : fg;
  const x = arr.find(z => sameLedgerItemId(z.id, l.itemId));
  if (!x) return alert(`Không tìm thấy mặt hàng “${l.item}” trong hệ thống.`);

  const type = normalizeActionType(l);
  const qty = Number(l.qty || 0);
  if (!type || !(qty > 0)) return alert('Nhật ký này thiếu loại giao dịch hoặc số lượng không hợp lệ.');

  // QA an toàn Ledger: trước khi xóa, mô phỏng toàn bộ chuỗi sau khi bỏ log.
  // Nếu việc xóa làm bất kỳ giao dịch phía sau âm tồn, tuyệt đối không cho xóa.
  const sim = simulateItemLedger(l.tab, x, null, null, l.id);
  if (!sim.ok) {
    return showInventoryNotice(
      '⚠️ KHÔNG THỂ XÓA NHẬT KÝ',
      `${sim.message}\n\nXóa nhật ký này sẽ làm Ledger của các giao dịch phía sau không hợp lệ. Hãy kiểm kê lại hoặc xử lý giao dịch liên quan trước.`
    );
  }

  const confirmed = await showInventoryConfirm(
    '⚠️ XÁC NHẬN XÓA NHẬT KÝ',
    `Bạn có chắc muốn xóa nhật ký “${l.action} ${fmt(qty)} ${l.unit}” của ${l.item}?\n\nHệ thống sẽ kiểm tra lại toàn bộ Ledger, xóa record Cloud và cập nhật lại các mốc Tồn trước/sau của các giao dịch phía sau.`
  );
  if (!confirmed) return;

  const oldItem = JSON.parse(JSON.stringify(x));
  const oldLogs = logs.slice();
  const resultMap = new Map(sim.results.map(r => [r.id, r]));
  const affectedLogs = logs
    .filter(z => z.tab === l.tab && sameLedgerItemId(z.itemId, l.itemId) && resultMap.has(z.id))
    .map(z => ({ id:z.id, before:z.before, after:z.after }));
  const table = l.tab === 'raw' ? 'raw_items' : 'fg_items';

  // Dựng item aggregate theo Ledger mới. Kiểm kê không cộng vào các cột giao dịch.
  if (l.tab === 'raw') {
    x.imported = sim.state.imported;
    x.exported = sim.state.exported;
  } else {
    x.production = sim.state.production;
    x.sales = sim.state.sales;
    x.returned = sim.state.returned;
    x.waste = sim.state.waste;
  }

  try {
    const { error: logError } = await supabaseClient.from('logs').delete().eq('id', id);
    if (logError) throw new Error(`Không thể xóa nhật ký trên Cloud: ${logError.message || logError}`);

    const { error: itemError } = await supabaseClient.from(table).upsert(x);
    if (itemError) throw new Error(`Không thể cập nhật tồn kho Cloud sau khi xóa: ${itemError.message || itemError}`);

    // Cập nhật before/after Cloud cho các giao dịch còn lại để Nhật Ký và Ledger cùng một trạng thái.
    for (const a of affectedLogs) {
      const r = resultMap.get(a.id);
      if (!r) continue;
      const { error } = await supabaseClient.from('logs').update({ before:Number(r.before), after:Number(r.after) }).eq('id', a.id);
      if (error) throw new Error(`Không thể cập nhật mốc Tồn của nhật ký ${a.id}: ${error.message || error}`);
    }

    logs = oldLogs.filter(z => z.id !== id).map(z => {
      const r = resultMap.get(z.id);
      if (r) return {...z, before:Number(r.before), after:Number(r.after)};
      return z;
    });
    sortLogsNewestFirst();
    saveLocalState();
    render();
    showSuccessToast('Đã xóa nhật ký và dựng lại Ledger thành công');
  } catch (err) {
    // Cố gắng khôi phục Cloud về trạng thái trước thao tác nếu một bước giữa chừng thất bại.
    try {
      await supabaseClient.from('logs').upsert({
        id:l.id, tab:l.tab, itemid:l.itemId, item:l.item, action:l.action, qty:qty, unit:l.unit,
        before:Number(l.before||0), after:Number(l.after||0), actiontype:type,
        unitcost:Number(l.unitCost||l.unitcost||0), conversionunit:l.conversionUnit||l.conversionunit||'',
        conversionqty:Number(l.conversionQty||l.conversionqty||0), dosage:Number(l.dosage||l.dosage||0),
        wasteqty:Number(l.wasteQty||l.wasteqty||0), yieldqty:Number(l.yieldQty||l.yieldqty||0),
        timestamp:Number(l.timestamp||Date.now()), datekey:l.dateKey||new Date().toLocaleDateString('en-CA'),
        userid:l.userId||l.username||currentUser.id||'', user:l.user||'', time:l.time||'',
        editedat:l.editedAt||null, editedby:l.editedBy||null
      });
      await supabaseClient.from(table).upsert(oldItem);
      for (const a of affectedLogs) {
        await supabaseClient.from('logs').update({before:Number(a.before||0),after:Number(a.after||0)}).eq('id',a.id);
      }
    } catch (rollbackError) {
      console.error('Rollback deleteLog failed:', rollbackError);
    }
    Object.assign(x, oldItem);
    logs = oldLogs;
    return showInventoryNotice('❌ XÓA NHẬT KÝ KHÔNG THÀNH CÔNG', `${err.message || err}\n\nDữ liệu trên màn hình đã được giữ nguyên.`);
  }
}

async function saveRawCosts() {
  if (!isOwnerRole()) return showInventoryNotice('⚠️ Không có quyền', 'Chỉ tài khoản Admin/Owner mới được thay đổi giá vốn.');
  const changes=[];
  for(const x of raw){ const costEl=document.getElementById('cost_'+x.id); if(!costEl) continue; const cost=Number(costEl.value||0), unit=String(document.getElementById('convunit_'+x.id)?.value||'').trim(), conv=Number(document.getElementById('convqty_'+x.id)?.value||0); if(!Number.isFinite(cost)||cost<0)return showInventoryNotice('⚠️ Giá vốn không hợp lệ',`${x.name}: giá vốn phải từ 0 trở lên.`); if(unit&&(!Number.isFinite(conv)||conv<=0))return showInventoryNotice('⚠️ Quy đổi chưa hợp lệ',`${x.name}: khi có đơn vị quy đổi phải nhập số lượng quy đổi lớn hơn 0.`); const changed=Math.abs(cost-rawUnitCost(x))>1e-9||unit!==rawConversionUnit(x)||Math.abs(conv-rawConversionQty(x))>1e-9; if(changed)changes.push({item:x,cost,unit,conv}); }
  if(!changes.length)return showInventoryNotice('ℹ️ Chưa có thay đổi','Không có giá vốn hoặc quy đổi nào được thay đổi.');
  try{ const updates=changes.map(c=>{const updated={...c.item,unit_cost:c.cost,conversion_unit:c.unit,conversion_qty:c.conv||0}; delete updated.unitCost; delete updated.conversionUnit; delete updated.conversionQty; return updated;}); const {error}=await supabaseClient.from('raw_items').upsert(updates); if(error)throw error; updates.forEach(updated=>{const local=raw.find(x=>sameLedgerItemId(x.id,updated.id));if(local)Object.assign(local,updated);}); openModal(rawCostView()); }catch(err){console.error('saveRawCosts failed:',err);showInventoryNotice('❌ Không thể lưu',err.message||String(err));}
}

function saveFabiReconcile() {
  const date = document.getElementById('fabiDate')?.value || localDateKey();
  const data = {};
  fg.forEach(x => {
    const el = document.getElementById('fabi_' + x.id);
    if (!el || el.value === '') return;
    const n = Number(el.value);
    if (!Number.isFinite(n) || n < 0) return;
    data[x.id] = n;
  });
  fabiRecords[date] = data;
  configSaveLocal('sb_fabi_reconcile', fabiRecords);
  saveConfigCloud('fabi_reconcile', fabiRecords).then(() => { showSuccessToast('Đã lưu số liệu Fabi'); openModal(reconcileView(date)); }).catch(e => alert('Đã lưu trên máy nhưng chưa đồng bộ Cloud: ' + (e.message || e)));
}
function reconcileView(dateKey = localDateKey()) {
  const saved = fabiRecords[dateKey] || {};
  const rows = fg.map(x => {

async function applyInventoryStocktake() {
  if (inventorySaving) return;
  if (!currentUser) return showInventoryNotice('⚠️ Phiên đăng nhập', 'Phiên đăng nhập không hợp lệ. Vui lòng đăng nhập lại.');
  if (!isOwnerRole()) return showInventoryNotice('⚠️ Không có quyền', 'Chỉ tài khoản Admin/Owner mới được thực hiện kiểm kê.');

  inventorySaving = true;
  const date = document.getElementById('countDate')?.value || localDateKey();
  const saved = { ...(inventoryCounts[date] || {}) };
  const all = [...raw.map(x=>['raw',x]), ...fg.map(x=>['fg',x])];

  all.forEach(([tab,x]) => {
    const el = document.getElementById('count_'+tab+'_'+x.id);
    if (!el || el.value === '') return;
    const n = normalizeQty1(el.value);
    if (Number.isFinite(n) && n >= 0) saved[tab+'|'+x.id] = n;
  });

  let changes = [];
  all.forEach(([tab,x]) => {
    const key = tab+'|'+x.id;
    if (saved[key] == null) return;
    const system = normalizeQty1(stockAtDate(tab, x, date));
    const actual = normalizeQty1(saved[key]);
    if (!Number.isFinite(actual) || actual < 0) return;
    if (Math.abs(actual - system) <= 1e-9) return;
    changes.push({tab, x, system, actual});
  });

  if (!changes.length) {
    inventorySaving = false;
    return showInventoryNotice('ℹ️ Chưa có chênh lệch', `Ngày kiểm kê: ${date}\n\nKhông có mặt hàng nào có chênh lệch so với tồn hệ thống.`);
  }

  const preview = changes.slice(0, 8)
    .map(c => `• ${c.x.name}: ${fmt(c.system)} → ${fmt(c.actual)} ${c.x.unit}`)
    .join('\n');
  const more = changes.length > 8 ? `\n• ... và ${changes.length - 8} mặt hàng khác` : '';

  const confirmed = await showInventoryConfirm(
    '🧾 XÁC NHẬN KIỂM KÊ',
    `Ngày kiểm kê: ${date}\nCó ${changes.length} mặt hàng có chênh lệch.\n\n${preview}${more}\n\nKiểm kê là ngoại lệ duy nhất được phép thay đổi Tồn hệ thống theo Tồn thực tế.\nHệ thống sẽ ghi Nhật Ký “Kiểm kê”.\n\nBạn có chắc chắn muốn xác nhận không?`
  );
  if (!confirmed) {
    inventorySaving = false;
    return;
  }

  try {
    // QUAN TRỌNG: sau khi người dùng xác nhận, đọc lại Cloud một lần nữa.
    // Nếu máy khác vừa thay đổi dữ liệu, tuyệt đối không ghi đè lên trạng thái cũ.
    const [rawRes, fgRes, logRes] = await Promise.all([
      supabaseClient.from('raw_items').select('*'),
      supabaseClient.from('fg_items').select('*'),
      supabaseClient.from('logs').select('*').order('timestamp', { ascending: false }).order('id', { ascending: false })
    ]);
    if (rawRes.error) throw new Error(`Không thể đọc Kho Thô mới nhất từ Cloud: ${rawRes.error.message || rawRes.error}`);
    if (fgRes.error) throw new Error(`Không thể đọc Thành phẩm mới nhất từ Cloud: ${fgRes.error.message || fgRes.error}`);
    if (logRes.error) throw new Error(`Không thể đọc Nhật Ký mới nhất từ Cloud: ${logRes.error.message || logRes.error}`);

    const freshRaw = (rawRes.data || []).map(x => normalizeInventoryItemNumbers(x, 'raw'));
    const freshFg = (fgRes.data || []).map(x => normalizeInventoryItemNumbers(x, 'fg'));
    const freshLogs = (logRes.data || []).map(l => normalizeInventoryLogNumbers({
      id:l.id, tab:l.tab, itemId:l.itemid, item:l.item, action:l.action,
      qty:Number(l.qty||0), unit:l.unit, before:Number(l.before||0), after:Number(l.after||0),
      actionType:l.actiontype, user:l.user, username:l.userid||'', userId:l.userid||'',
      timestamp:Number(l.timestamp||0), dateKey:l.datekey||'', editedAt:l.editedat||null,
      editedBy:l.editedby||null, time:l.time||'', unitCost:Number(l.unitcost||0)
    }));

    const freshAll = [...freshRaw.map(x=>['raw',x]), ...freshFg.map(x=>['fg',x])];
    const freshMap = new Map(freshAll.map(([tab,x]) => [tab+'|'+x.id, {tab,x}]));
    const freshChanges = [];
    let staleDetected = false;

    for (const c of changes) {
      const fresh = freshMap.get(c.tab+'|'+c.x.id);
      if (!fresh) throw new Error(`Mặt hàng “${c.x.name}” không còn tồn tại trên Cloud.`);
      const freshSystem = normalizeQty1(calculateStockFromLogs(c.tab, fresh.x, freshLogs, date === localDateKey() ? Date.now() : getDayBoundaryMs(date, true)));
      const enteredActual = normalizeQty1(saved[c.tab+'|'+c.x.id]);
      if (Math.abs(freshSystem - c.system) > 1e-9) staleDetected = true;
      if (Math.abs(enteredActual - freshSystem) <= 1e-9) continue;
      freshChanges.push({tab:c.tab, x:fresh.x, system:freshSystem, actual:enteredActual});
    }

    if (staleDetected) {
      inventorySaving = false;
      return showInventoryNotice(
        '⚠️ DỮ LIỆU VỪA THAY ĐỔI TRÊN MÁY KHÁC',
        'Hệ thống phát hiện tồn Cloud đã thay đổi sau khi bạn mở màn hình kiểm kê.\n\nĐể tránh ghi đè dữ liệu của máy khác, lần kiểm kê này chưa được ghi.\n\nVui lòng đóng màn hình kiểm kê, mở lại và kiểm tra lại số thực tế trước khi xác nhận.'
      );
    }

    changes = freshChanges;
    if (!changes.length) {
      inventorySaving = false;
      closeModal();
      render();
      return showInventoryNotice('ℹ️ Không còn chênh lệch', 'Dữ liệu Cloud đã thay đổi và hiện không còn mặt hàng nào cần điều chỉnh.');
    }

    const payload = [];
    const batchId = `inv_${Date.now()}_${Math.random().toString(36).slice(2,8)}`;
    const todayKey = localDateKey();
    const nowBase = date === todayKey
      ? Date.now()
      : getDayBoundaryMs(date, true) - Math.min(changes.length, 500);

    for (let i = 0; i < changes.length; i++) {
      const c = changes[i];
      const id = `log_${batchId}_${i}`;
      const timestamp = nowBase + i;
      payload.push({
        id,
        tab: c.tab,
        itemid: c.x.id,
        item: c.x.name,
        action: 'Kiểm kê',
        qty: normalizeQty1(c.actual),
        unit: c.x.unit,
        before: normalizeQty1(c.system),
        after: normalizeQty1(c.actual),
        actiontype: 'stocktake',
        unitcost: c.tab === 'raw' ? rawUnitCost(c.x) : 0,
        conversionunit: c.tab === 'raw' ? rawConversionUnit(c.x) : '',
        conversionqty: c.tab === 'raw' ? Number(c.x.conversion_qty || 0) : 0,
        dosage: c.tab === 'raw' ? Number(c.x.usage_per_product || 0) : 0,
        wasteqty: c.tab === 'raw' ? Number(c.x.waste_qty || 0) : 0,
        yieldqty: 0,
        timestamp,
        datekey: date,
        userid: currentUser.id || currentUser.username || '',
        user: `${currentUser.name} (${roleLabel(currentUser.role)})`,
        time: new Date(timestamp).toLocaleString('vi-VN'),
        editedat: null,
        editedby: null
      });
    }

    // Một request insert duy nhất = một batch. Sau đó bắt buộc kiểm tra đủ ID đã có trên Cloud.
    const { error: logError } = await supabaseClient.from('logs').insert(payload);
    if (logError) throw new Error(`Không thể ghi Nhật Ký kiểm kê Cloud: ${logError.message || logError}`);

    const ids = payload.map(x => x.id);
    const { data: verifyRows, error: verifyError } = await supabaseClient
      .from('logs')
      .select('id')
      .in('id', ids);
    if (verifyError) throw new Error(`Đã ghi kiểm kê nhưng không thể xác minh đủ Nhật Ký Cloud: ${verifyError.message || verifyError}`);

    const verified = new Set((verifyRows || []).map(x => x.id));
    const missing = ids.filter(id => !verified.has(id));
    if (missing.length !== 0 || verified.size !== ids.length) {
      throw new Error(`Kiểm kê chưa được xác minh đầy đủ trên Cloud: cần ${ids.length} dòng, xác nhận được ${verified.size} dòng.`);
    }

    delete inventoryCounts[date];
    localStorage.removeItem('sb_inventory_counts');

    const localLogs = payload.map(l => normalizeInventoryLogNumbers({
      ...l,
      itemId: l.itemid,
      actionType: l.actiontype,
      userId: l.userid,
      username: currentUser.username || '',
      dateKey: l.datekey,
      editedAt: null,
      editedBy: null,
      editDetail: '',
      time: l.time
    }));
    logs = [...localLogs, ...logs.filter(x => !verified.has(x.id))];
    sortLogsNewestFirst();
    saveLocalState();

    closeModal();
    render();
    inventorySaving = false;
    showSuccessToast(`${changes.length} mặt hàng đã được kiểm kê · đã xác minh ${changes.length}/${changes.length} Nhật Ký Cloud`);
  } catch (err) {
    inventorySaving = false;
    return showInventoryNotice('❌ KIỂM KÊ KHÔNG HOÀN TẤT', `${err.message || err}\n\nHệ thống không coi lần kiểm kê này là thành công.`);
  }
}

  const chip=(key,label)=>`<button class="filter-chip ${inventoryTab===key?'active':''}" onclick="inventoryTab='${key}';openModal(inventoryView('${dateKey}'))">${label}</button>`;

function itemSortValue(x, fallbackIndex=0) {
  const n = Number(x?.sort_order);
  return Number.isFinite(n) ? n : 1000000000 + fallbackIndex;
}
function sortItemsForDisplay(arr) {
  return arr.slice().sort((a,b) => itemSortValue(a, arr.indexOf(a)) - itemSortValue(b, arr.indexOf(b)) || String(a.name||'').localeCompare(String(b.name||''), 'vi'));
}
function normalizeSortOrders(arr) {
  sortItemsForDisplay(arr).forEach((x,i) => { x.sort_order = (i + 1) * 10; });
}

function initOrderingDrag() {
  const list = document.getElementById('orderingList');
  if (!list) return;
  let dragging = null, ghost = null, startY = 0, moved = false;
  const rows = () => [...list.querySelectorAll('.ordering-row')];
  const begin = (row, y) => {
    dragging = row; startY = y; moved = false;
    row.classList.add('dragging');
  };
  const move = (y, clientX) => {
    if (!dragging) return;
    if (Math.abs(y - startY) > 6) moved = true;
    if (!moved) return;
    const target = document.elementFromPoint(clientX, y)?.closest('.ordering-row');
    if (!target || target === dragging || !list.contains(target)) return;
    const rect = target.getBoundingClientRect();
    if (y < rect.top + rect.height / 2) list.insertBefore(dragging, target);
    else list.insertBefore(dragging, target.nextSibling);
    updateOrderingNumbers();
  };
  const end = () => {
    if (!dragging) return;
    dragging.classList.remove('dragging');
    dragging = null;
    updateOrderingNumbers();
  };
  rows().forEach(row => {
    row.addEventListener('touchstart', e => {
      if (e.touches.length !== 1) return;
      begin(row, e.touches[0].clientY);
    }, {passive:true});
    row.addEventListener('touchmove', e => {
      if (!dragging) return;
      const t=e.touches[0];
      if (moved || Math.abs(t.clientY-startY)>6) { e.preventDefault(); move(t.clientY,t.clientX); }
    }, {passive:false});
    row.addEventListener('touchend', end, {passive:true});
    row.addEventListener('touchcancel', end, {passive:true});
    row.addEventListener('mousedown', e => {
      if (e.button !== 0) return;
      begin(row, e.clientY);
      const mm = ev => move(ev.clientY, ev.clientX);
      const mu = () => { document.removeEventListener('mousemove',mm); document.removeEventListener('mouseup',mu); end(); };
      document.addEventListener('mousemove',mm);
      document.addEventListener('mouseup',mu);
    });
  });
}
function updateOrderingNumbers() {
  document.querySelectorAll('#orderingList .ordering-row').forEach((row,i)=>{

async function saveOrdering() {
  if (!isOwnerRole()) return showInventoryNotice('⚠️ Không có quyền', 'Chỉ tài khoản Admin/Owner mới được sắp xếp mặt hàng.');
  const arr = orderingTab === 'raw' ? raw : fg;
  const rows = [...document.querySelectorAll('#orderingList .ordering-row')];
  const old = arr.map(x => ({...x}));
  const changes = rows.map((row,i) => {
    const item = arr.find(x => x.id === row.dataset.id);
    if (!item) return null;
    const updated = {...item, sort_order:(i+1)*10};
    return {item, updated};
  }).filter(Boolean);
  try {
    for (const c of changes) await syncItemToSupabase(orderingTab, c.updated);
    changes.forEach(c => Object.assign(c.item, c.updated));
    saveLocalState();
    closeModal();
    render();
    showSuccessToast('Đã lưu thứ tự hiển thị');
  } catch (e) {
    arr.forEach((x,i)=>Object.assign(x, old[i]));
    showInventoryNotice('❌ Chưa lưu được', e.message || String(e));
  }
}

function initTableStickyGroup(){
  const table=document.querySelector('.entry-table');
  const scroller=document.querySelector('.table-scroll');
  const wrap=document.querySelector('.table-entry-wrap');
  if(!table||!scroller||!wrap)return;
  const groups=Array.from(table.querySelectorAll('tr.group-row'));
  const realHead=table.querySelector('thead');
  const headCell=table.querySelector('thead th:first-child');
  const fit=()=>{
    const cols=table.querySelectorAll('thead th'); if(!cols.length)return;
    const nameW=Math.max(84,Math.min(96,Math.round(window.innerWidth*0.2)));
    const n=cols.length-1;
    const available=Math.max(0,scroller.clientWidth-nameW);
    const minData=64;
    const dataW=Math.max(minData,Math.floor(available/n));
    table.style.setProperty('--name-col',nameW+'px');
    table.style.setProperty('--data-col',dataW+'px');
    table.style.width=(nameW+dataW*n)+'px';
    if(nameW+dataW*n<=scroller.clientWidth+1) table.style.width='100%';
    buildFloatingHeader();
  };
  const activeGroup=()=>{
    if(!headCell||!groups.length)return 'Tất cả';
    const hb=headCell.getBoundingClientRect().bottom;
    let active=groups[0].dataset.group||'Tất cả';
    for(const g of groups){ if(g.getBoundingClientRect().top<=hb+1) active=g.dataset.group||active; else break; }
    return active;
  };
  const buildFloatingHeader=()=>{
    let float=document.getElementById('tableFloatingHeader');
    if(!float){
      float=document.createElement('div'); float.id='tableFloatingHeader'; float.className='table-floating-header';
      float.innerHTML='<div class="floating-track"><table><thead></thead></table></div>';
      document.body.appendChild(float);
    }
    const fthead=float.querySelector('thead');
    fthead.innerHTML=realHead?realHead.innerHTML:'';
    const realCells=table.querySelectorAll('thead th');
    const fCells=float.querySelectorAll('th');
    realCells.forEach((c,i)=>{ if(fCells[i]){ const w=c.getBoundingClientRect().width; fCells[i].style.width=w+'px'; fCells[i].style.minWidth=w+'px'; fCells[i].style.maxWidth=w+'px'; } });
    float.style.height=(realHead?.getBoundingClientRect().height||48)+'px';
    float.style.width=scroller.getBoundingClientRect().width+'px';
    float.querySelector('table').style.width=table.getBoundingClientRect().width+'px';
    float.querySelector('.floating-track').style.width=table.getBoundingClientRect().width+'px';
  };
  const update=()=>{
    const r=wrap.getBoundingClientRect();
    const scR=scroller.getBoundingClientRect();
    const headerH=realHead?.getBoundingClientRect().height||48;
    const show=r.top<=0 && r.bottom>headerH+2;
    let float=document.getElementById('tableFloatingHeader');
    if(!float) { buildFloatingHeader(); float=document.getElementById('tableFloatingHeader'); }
    if(show){
      float.classList.add('is-visible');
      float.style.left=scR.left+'px';
      float.style.top='0px';
      float.style.width=scroller.clientWidth+'px';
      float.querySelector('.floating-track').style.transform=`translateX(${-scroller.scrollLeft}px)`;
      const group=activeGroup();
      const first=float.querySelector('th:first-child');
      if(first) first.textContent=group;
      tableHeaderGroup(group);
    }else{
      float.classList.remove('is-visible');
    }
  };
  const onHScroll=()=>{
    const float=document.getElementById('tableFloatingHeader');
    if(float?.classList.contains('is-visible')) float.querySelector('.floating-track').style.transform=`translateX(${-scroller.scrollLeft}px)`;
  };
  if(window.__tableGroupScrollHandler) window.removeEventListener('scroll',window.__tableGroupScrollHandler);
  if(window.__tableResizeHandler) window.removeEventListener('resize',window.__tableResizeHandler);
  if(window.__tableHorizontalScrollHandler) scroller.removeEventListener('scroll',window.__tableHorizontalScrollHandler);
  window.__tableGroupScrollHandler=update;
  window.__tableResizeHandler=()=>{fit();update();};
  window.__tableHorizontalScrollHandler=onHScroll;
  window.addEventListener('scroll',update,{passive:true});
  window.addEventListener('resize',window.__tableResizeHandler,{passive:true});
  scroller.addEventListener('scroll',onHScroll,{passive:true});
  fit();
  requestAnimationFrame(()=>{buildFloatingHeader();update();});
}

    data_repair: 'Sửa dữ liệu lỗi cũ'
  };
  return labels[type] || String(log.action || 'Giao dịch');
}

function auditEditSummary(log) {
  if (!log.editedAt) return '';
  const detail = String(log.editDetail || '').trim();
  return detail || `Số lượng hiện tại: ${fmt(log.qty)} ${log.unit}`;
}

function getAuditItemGroup(log) {
  const item = (log?.tab === 'raw' ? raw : fg).find(x => x.id === log?.itemId);
  return String(item?.group || item?.category || 'Khác').trim() || 'Khác';
}

function applyAuditSearch() {
  auditSearch = String(auditSearchInput || '').trim();
  render();
}

function auditView() {
  const filters = [
    ['Tất cả', 'Tất cả'],
    ['import', 'Nhập kho'],
    ['export', 'Xuất kho'],
    ['sales', 'Xuất bán'],
    ['production', 'Nấu thêm'],
    ['return', 'Thu hồi'],
    ['waste', 'Hủy món'],
  ];
  const groupSet = new Set();
  raw.forEach(x => groupSet.add(String(x.group || 'Khác').trim() || 'Khác'));
  fg.forEach(x => groupSet.add(String(x.category || 'Khác').trim() || 'Khác'));
  const groups = ['Tất cả', ...Array.from(groupSet).filter(g => g !== 'Tất cả').sort((a,b) => a.localeCompare(b, 'vi'))];
  const list = getFilteredLogs().filter(l => {
    const typeOk = auditType === 'Tất cả' || normalizeActionType(l) === auditType;
    const groupOk = auditGroup === 'Tất cả' || getAuditItemGroup(l) === auditGroup;
    const q = String(auditSearch || '').trim().toLocaleLowerCase('vi-VN');
    const searchOk = !q || [
      l.user, l.item, getAuditItemGroup(l), auditActionLabel(l), l.unit
    ].some(v => String(v || '').toLocaleLowerCase('vi-VN').includes(q));
    return typeOk && groupOk && searchOk;
  });

  return `
    ${dateFilterView()}
    <div class="filter-wrapper">
      <div style="font-size:11px;font-weight:800;color:var(--text-muted);margin:0 0 6px 2px;text-transform:uppercase">Phân loại thao tác</div>

      <div style="font-size:11px;font-weight:800;color:var(--text-muted);margin:10px 0 6px 2px;text-transform:uppercase">Nhóm nguyên liệu</div>
      <div class="filter-scroll">
        ${groups.map(g => `<button class="filter-chip ${auditGroup === g ? 'active' : ''}" onclick="auditGroup='${g}';render()">${g}</button>`).join('')}
      </div>
    </div>
    <div class="card-list">
      <div class="audit-search-box">
        <input id="auditSearchInput" class="audit-search-input" type="search" value="${tableEsc(auditSearchInput)}" placeholder="Tìm nhân viên, nguyên liệu, nhóm..." oninput="auditSearchInput=this.value" onkeydown="if(event.key==='Enter'){applyAuditSearch();}">
        <button class="audit-search-btn" type="button" onclick="applyAuditSearch()">🔎 Tìm kiếm</button>
      </div>
      ${list.map(l => {
        const allowEdit = canEditLog(l);
        const itemGroup = getAuditItemGroup(l);
        return `
        <div class="audit-transaction-card ${l.editedAt ? 'audit-row-edited' : ''}">
          <div class="audit-topline">
            <div class="audit-employee">${l.user}</div>
            <div class="audit-time">${l.time}</div>
          </div>
          <div class="audit-detail-row">
            <div class="audit-item-name">${l.item}</div>
            <span class="audit-status ${auditActionClass(l)}">${auditActionLabel(l)}</span>
          </div>
          <div class="audit-divider"></div>
          ${l.tab==='raw' && normalizeActionType(l)==='export' && logConversionUnit(l) && logUsagePerProduct(l) ? `<div class="audit-conversion">↳ Quy đổi: 1 ${tableEsc(l.unit)} = ${fmt(logConversionQty(l))} ${tableEsc(logConversionUnit(l))} · ${fmt(logUsagePerProduct(l))} ${tableEsc(logConversionUnit(l))}/ly · hao hụt ${fmt(logWasteQty(l))} ${tableEsc(logConversionUnit(l))} · ≈ ${fmt(logYieldQty(l))} ly</div>` : ''}
          <div class="audit-detail-row">
            <div class="audit-group-name">${itemGroup}</div>
            <div class="audit-qty">${fmt(l.qty)} <span class="unit">${l.unit}</span></div>
          </div>
          ${l.editedAt ? `<div class="audit-edited-line"><span class="audit-change">→ ${auditEditSummary(l)}</span><span class="audit-edited-meta">✎ Đã sửa ${l.editedAt}</span></div>` : ''}
          <div style="display:flex;gap:12px;margin-top:${l.editedAt ? '7px' : '9px'}">

          </div>
        </div>

function sbNowIso(){ return new Date().toISOString(); }

function sbRoleOk(){ return isOwnerRole(); }
function sbDateInput(v){ return /^\d{4}-\d{2}-\d{2}$/.test(String(v||'')) ? v : localDateKey(); }
function sbEffectiveRecipe(list,name,date=localDateKey()){

    .sort((a,b)=>Number(b.version_no||0)-Number(a.version_no||0)||String(b.effective_from||'').localeCompare(String(a.effective_from||'')))[0]||null;
}

function sbLineSourceName(line){ return line.source_type==='raw' ? sbRawName(line.source_item_id) : sbFgName(line.source_item_id); }
function sbUnitForLine(line){ const item=line.source_type==='raw'?raw.find(x=>String(x.id)===String(line.source_item_id)):fg.find(x=>String(x.id)===String(line.source_item_id)); return line.unit || item?.unit || ''; }

async function sbLoadBusinessData(){

  const qs=[
    supabaseClient.from('sb_cook_recipes').select('*').order('name').order('version_no',{ascending:false}),
    supabaseClient.from('sb_cook_recipe_lines').select('*'),
    supabaseClient.from('sb_dish_recipes').select('*').order('name').order('version_no',{ascending:false}),
    supabaseClient.from('sb_dish_recipe_lines').select('*'),
    supabaseClient.from('sb_fabi_sales').select('*').order('sale_date',{ascending:false}).order('created_at',{ascending:false})
  ];
  const [a,b,c,d,e]=await Promise.all(qs);
  for(const [res,label] of [[a,'Công thức nấu'],[b,'Chi tiết công thức nấu'],[c,'Công thức món'],[d,'Chi tiết công thức món'],[e,'Fabi']]) if(res.error) throw new Error(label+': '+res.error.message);
  sbCookRecipes=a.data||[]; sbCookLines=b.data||[]; sbDishRecipes=c.data||[]; sbDishLines=d.data||[]; sbFabiSales=e.data||[];
}

  const cards=grouped.map(r=>{const lines=(tab==='cook'?sbCookLines:sbDishLines).filter(l=>l.recipe_id===r.id),status=r.effective_from>localDateKey()?'Sắp áp dụng':(r.active===false?'Ngưng':'Đang dùng');return `<div class="sb-biz-card"><div class="sb-biz-head"><div><b>${sbEsc(r.name)}${tab==='dish'&&r.size_name?` · ${sbEsc(r.size_name)}`:''}</b><small>Phiên bản ${Number(r.version_no||1)} · hiệu lực ${sbEsc(r.effective_from||'')}</small></div><span class="sb-status ${status==='Đang dùng'?'ok':status==='Sắp áp dụng'?'wait':'off'}">${status}</span></div><div class="sb-line-list">${lines.slice(0,5).map(l=>`<div><span>${sbEsc(l.source_type==='raw'?sbRawName(l.source_item_id):sbFgName(l.source_item_id))}</span><b>${fmt(l.qty)} ${sbEsc(sbUnitForLine(l))}</b></div>`).join('')}${lines.length>5?`<div class="sb-more">+ ${lines.length-5} thành phần</div>`:''}</div><div class="sb-card-actions"><button onclick="sbEditRecipe('${r.id}','${tab}')">Sửa</button><button onclick="sbDuplicateRecipe('${r.id}','${tab}')">Tạo phiên bản mới</button></div></div>`;}).join('');
  const title=tab==='cook'?'🧪 Công thức nấu':'🥤 Công thức món',note=tab==='cook'?'Nguyên liệu thô → Thành phẩm. Mỗi phiên bản có ngày hiệu lực để lịch sử không bị tính lại theo công thức mới.':'Kho Thô + Kho Thành Phẩm → Món / Size. Công thức món có thể dùng đồng thời cả hai nguồn.';
  return `<div class="sb-modal-wrap"><div class="sb-modal-title"><div><h2>${title}</h2><p>${note}</p></div><button class="sb-x" onclick="closeModal()">×</button></div>${tabs}<div class="sb-toolbar"><button class="sb-primary" onclick="sbNewRecipe('${tab}')">＋ Tạo ${tab==='cook'?'công thức nấu':'công thức món'}</button></div>${cards||'<div class="sb-empty">Chưa có công thức. Hãy tạo công thức đầu tiên.</div>'}<div class="sb-footer"><button onclick="closeModal()">Đóng</button></div></div>`;

function sbNewRecipe(tab){ if(tab==='integrity')return; sbEditingRecipeId=null; openModal(sbRecipeEditor(tab,null)); }
function sbRecipeLines(tab,recipeId){ return (tab==='cook'?sbCookLines:sbDishLines).filter(l=>l.recipe_id===recipeId); }
function sbRecipeEditor(tab,recipeId){
  const isCook=tab==='cook'; const list=isCook?sbCookRecipes:sbDishRecipes; const r=recipeId?list.find(x=>x.id===recipeId):null;
  const lines=r?sbRecipeLines(tab,r.id):[];
  const currentLines=lines.map((l,i)=>sbLineEditor(l,i,tab)).join('');
  const yieldItem=isCook?`<div class="sb-grid2"><label>Sản phẩm thành phẩm<select id="sbRecipeFg">${fg.map(x=>`<option value="${x.id}" ${String(x.id)===String(r?.fg_item_id)?'selected':''}>${sbEsc(x.name)} · ${sbEsc(x.unit)}</option>`).join('')}</select></label><label>Sản lượng chuẩn<input id="sbRecipeYield" type="number" min="0.000001" step="any" value="${r?.yield_qty??''}" placeholder="25"><small>Ví dụ: 25 L</small></label></div>`:`<div class="sb-grid2"><label>Size ly<input id="sbRecipeSize" value="${sbEsc(r?.size_name||'')}" placeholder="M, L, 700ml..."></label><div class="sb-kpi"><span>Phiên bản</span><b>${Number(r?.version_no||1)}</b></div></div>`;
  return `<div class="sb-modal-wrap"><div class="sb-modal-title"><div><h2>${r?'✏️ Sửa công thức':'＋ Tạo công thức'}</h2><p>${isCook?'Một phiên bản công thức nấu chỉ có 1 thành phẩm đầu ra.':'Nhập tên món + size, sau đó chọn nguyên liệu từ Kho Thô hoặc Thành Phẩm. Chỉ nhập số lượng; đơn vị được hệ thống tự lấy theo đơn vị chuẩn.'}</p></div><button class="sb-x" onclick="openModal(recipeCenterView('${tab}'))">×</button></div><div class="sb-form"><label>${isCook?'Tên công thức':'Tên món'}<input id="sbRecipeName" value="${sbEsc(r?.name||'')}" placeholder="${isCook?'Ví dụ: Trà sữa truyền thống':'Ví dụ: Trà sữa truyền thống'}"></label>${yieldItem}<div class="sb-grid2"><label>Ngày hiệu lực<input id="sbRecipeDate" type="date" value="${sbDateInput(r?.effective_from)}"></label><label>Ghi chú<input id="sbRecipeNote" value="${sbEsc(r?.note||'')}" placeholder="Tùy chọn"></label></div><div class="sb-section-head"><b>${isCook?'Nguyên liệu cấu thành':'Nguyên liệu cấu thành món'}</b><button onclick="sbAddLine('${tab}')">＋ Thêm nguyên liệu</button></div><div id="sbRecipeLines">${currentLines}</div><div class="sb-form-hint">${isCook?'Đơn vị nguyên liệu được lấy theo đơn vị quy đổi của Kho Thô.':'Chọn nguyên liệu từ 2 nguồn: Kho Thô hoặc Kho Thành Phẩm. Bạn chỉ nhập số lượng; đơn vị tự lấy chuẩn: Kho Thô dùng Đơn vị quy đổi, Thành Phẩm dùng ĐVT của thành phẩm.'}</div></div><div class="sb-footer"><button onclick="openModal(recipeCenterView('${tab}'))">Hủy</button><button class="sb-primary" onclick="sbSaveRecipe('${tab}','${recipeId||''}')">💾 Lưu công thức</button></div></div>`;
}
function sbLineEditor(l,i,tab){
  const sourceOptions=tab==='cook'
    ? raw.map(x=>`<option value="raw:${x.id}" ${String(l?.source_item_id)===String(x.id)?'selected':''}>${sbEsc(x.name)}</option>`).join('')
    : [...raw.map(x=>`<option value="raw:${x.id}" ${l?.source_type==='raw'&&String(l.source_item_id)===String(x.id)?'selected':''}>[Kho Thô] ${sbEsc(x.name)}</option>`),...fg.map(x=>`<option value="fg:${x.id}" ${l?.source_type==='fg'&&String(l.source_item_id)===String(x.id)?'selected':''}>[Thành phẩm] ${sbEsc(x.name)}</option>`)].join('');
  const type=l?.source_type||'raw'; const item=type==='raw'?raw.find(x=>String(x.id)===String(l?.source_item_id)):fg.find(x=>String(x.id)===String(l?.source_item_id));
  const unit=type==='raw'?(rawConversionUnit(item)||item?.unit||''):item?.unit||'';
  return `<div class="sb-line-editor" data-line-index="${i}"><select class="sb-line-source" onchange="sbRefreshLineUnit(this)">${sourceOptions}</select><input class="sb-line-qty" type="number" min="0.000001" step="any" value="${l?.qty??''}" placeholder="Số lượng"><span class="sb-line-unit-auto">${sbEsc(unit||'—')}</span><button type="button" onclick="this.closest('.sb-line-editor').remove()">×</button></div>`;
}
function sbRefreshLineUnit(sel){
  const row=sel.closest('.sb-line-editor'); if(!row)return; const v=sel.value||''; const [type,id]=v.split(':'); const item=type==='raw'?raw.find(x=>String(x.id)===String(id)):fg.find(x=>String(x.id)===String(id)); const unit=type==='raw'?(rawConversionUnit(item)||item?.unit||''):item?.unit||''; const u=row.querySelector('.sb-line-unit-auto'); if(u)u.textContent=unit||'—';
}
function sbAddLine(tab){ const box=document.getElementById('sbRecipeLines'); if(!box)return; const i=box.querySelectorAll('.sb-line-editor').length; const holder=document.createElement('div'); holder.innerHTML=sbLineEditor(null,i,tab); box.appendChild(holder.firstElementChild); }
function sbCollectLines(tab){
  return [...document.querySelectorAll('#sbRecipeLines .sb-line-editor')].map(row=>{const v=row.querySelector('.sb-line-source')?.value||'';const [source_type,source_item_id]=v.split(':'); const item=source_type==='raw'?raw.find(x=>String(x.id)===String(source_item_id)):fg.find(x=>String(x.id)===String(source_item_id)); const unit=source_type==='raw'?(rawConversionUnit(item)||item?.unit||''):item?.unit||''; return {source_type,source_item_id,qty:Number(row.querySelector('.sb-line-qty')?.value||0),unit};});
}
async function sbSaveRecipe(tab,recipeId){
  if(!sbRoleOk())return; const isCook=tab==='cook'; const list=isCook?sbCookRecipes:sbDishRecipes; const old=recipeId?list.find(x=>x.id===recipeId):null;
  const name=String(document.getElementById('sbRecipeName')?.value||'').trim(); const sizeName=isCook?'':String(document.getElementById('sbRecipeSize')?.value||'').trim(); const effective=document.getElementById('sbRecipeDate')?.value||localDateKey(); const note=String(document.getElementById('sbRecipeNote')?.value||'').trim();
  if(!name)return showInventoryNotice('⚠️ Thiếu tên','Hãy nhập tên công thức.'); if(!isCook&&!sizeName)return showInventoryNotice('⚠️ Thiếu size ly','Hãy nhập size ly cho món.'); if(!/^\d{4}-\d{2}-\d{2}$/.test(effective))return showInventoryNotice('⚠️ Ngày hiệu lực','Ngày hiệu lực không hợp lệ.');
  const lines=sbCollectLines(tab); if(!lines.length)return showInventoryNotice('⚠️ Chưa có nguyên liệu','Công thức phải có ít nhất 1 nguyên liệu.');
  const seen=new Set();
  for(const l of lines){if(!l.source_item_id||!l.unit||!Number.isFinite(l.qty)||l.qty<=0)return showInventoryNotice('⚠️ Thành phần không hợp lệ','Mọi nguyên liệu phải có số lượng lớn hơn 0 và đơn vị chuẩn phải xác định được.');const key=l.source_type+':'+l.source_item_id;if(seen.has(key))return showInventoryNotice('⚠️ Trùng nguyên liệu',`Không được khai báo trùng ${sbLineSourceName(l)}.`);seen.add(key);if(l.source_type==='raw'&&!raw.some(x=>String(x.id)===String(l.source_item_id)))return showInventoryNotice('⚠️ Liên kết lỗi','Nguyên liệu Kho Thô không còn tồn tại.');if(l.source_type==='fg'&&!fg.some(x=>String(x.id)===String(l.source_item_id)))return showInventoryNotice('⚠️ Liên kết lỗi','Thành phẩm không còn tồn tại.');}
  const fgId=isCook?document.getElementById('sbRecipeFg')?.value:null; const yieldQty=isCook?Number(document.getElementById('sbRecipeYield')?.value||0):0;
  if(isCook&&(!fgId||!Number.isFinite(yieldQty)||yieldQty<=0))return showInventoryNotice('⚠️ Sản lượng không hợp lệ','Công thức nấu phải có thành phẩm đầu ra và sản lượng chuẩn > 0.');
  try{
    const version=old?Number(old.version_no||1)+1:Math.max(0,...list.filter(x=>String(x.name).trim().toLowerCase()===name.toLowerCase() && String(x.size_name||'').trim().toLowerCase()===sizeName.toLowerCase()).map(x=>Number(x.version_no||0)))+1;
    const id=sbId(isCook?'cook':'dish'); const header={id,name,version_no:version,effective_from:effective,active:true,note,created_at:sbNowIso(),created_by:currentUser.id||currentUser.username||''};
    if(!isCook)header.size_name=sizeName;
    if(isCook)header.fg_item_id=fgId,header.yield_qty=yieldQty,header.yield_unit=fg.find(x=>String(x.id)===String(fgId))?.unit||'';
    const table=isCook?'sb_cook_recipes':'sb_dish_recipes'; const lineTable=isCook?'sb_cook_recipe_lines':'sb_dish_recipe_lines';
    const {error:hErr}=await supabaseClient.from(table).insert([header]);if(hErr)throw hErr;
    const payload=lines.map(l=>({id:sbId('line'),recipe_id:id,source_type:l.source_type,source_item_id:l.source_item_id,qty:l.qty,unit:l.unit,created_at:sbNowIso()}));
    const {error:lErr}=await supabaseClient.from(lineTable).insert(payload);if(lErr){await supabaseClient.from(table).delete().eq('id',id);throw lErr;}
    if(old){const {error}=await supabaseClient.from(table).update({active:false}).eq('id',old.id);if(error){await supabaseClient.from(lineTable).delete().eq('recipe_id',id);await supabaseClient.from(table).delete().eq('id',id);throw error;}}
    await sbLoadBusinessData(); openModal(recipeCenterView(tab)); showSuccessToast('Đã lưu công thức và tạo phiên bản mới.');
  }catch(e){showInventoryNotice('❌ CHƯA LƯU ĐƯỢC',e.message||String(e));}
}
async function sbEditRecipe(id,tab){ await sbEnsureLoaded(); sbEditingRecipeId=id; openModal(sbRecipeEditor(tab,id)); }
async function sbDuplicateRecipe(id,tab){ await sbEnsureLoaded(); const list=tab==='cook'?sbCookRecipes:sbDishRecipes; const r=list.find(x=>x.id===id); if(!r)return; openModal(sbRecipeEditor(tab,id)); }

function sbExpandDish(recipe,qty,memo=new Map(),path=[]){
  const lines=sbDishLines.filter(l=>l.recipe_id===recipe.id);
  for(const l of lines){
    const amount=qty*Number(l.qty||0); const key=l.source_type+':'+l.source_item_id+':'+(l.unit||''); memo.set(key,(memo.get(key)||0)+amount);
    if(l.source_type==='fg'){
      const child=sbEffectiveRecipe(sbCookRecipes,sbFgName(l.source_item_id));
      if(child){if(path.includes(child.id)) continue; const factor=amount/Math.max(0.000001,Number(child.yield_qty||0)); sbExpandCook(child,factor,memo,path.concat(recipe.id));}
    }
  } return memo;
}
function sbExpandCook(recipe,batchFactor,memo,path=[]){
  for(const l of sbCookLines.filter(l=>l.recipe_id===recipe.id)){const amount=batchFactor*Number(l.qty||0);const key='raw:'+l.source_item_id+':'+(l.unit||'');memo.set(key,(memo.get(key)||0)+amount);} return memo;
}
function sbDishCost(recipeId,qty=1){ const r=sbDishRecipes.find(x=>x.id===recipeId); if(!r)return {raw:new Map(),cost:0}; const memo=sbExpandDish(r,qty); let cost=0; for(const [k,v] of memo){if(k.startsWith('raw:')){const p=k.split(':');cost+=sbCostOfRaw(p[1],v,p.slice(2).join(':'));}} return {raw:memo,cost}; }

function recipeIntegrityContent(){
  if(!sbRoleOk())return ''; const issues=[];
  for(const r of sbCookRecipes){ if(!fg.some(x=>String(x.id)===String(r.fg_item_id)))issues.push(`Công thức nấu “${r.name}” đang trỏ tới thành phẩm không tồn tại.`); const ls=sbCookLines.filter(l=>l.recipe_id===r.id); if(!ls.length)issues.push(`Công thức nấu “${r.name}” chưa có nguyên liệu.`); for(const l of ls)if(!raw.some(x=>String(x.id)===String(l.source_item_id)))issues.push(`Công thức nấu “${r.name}” có nguyên liệu đã bị xóa.`);}
  for(const r of sbDishRecipes){const ls=sbDishLines.filter(l=>l.recipe_id===r.id);if(!ls.length)issues.push(`Công thức món “${r.name}” chưa có thành phần.`);for(const l of ls){const arr=l.source_type==='raw'?raw:fg;if(!arr.some(x=>String(x.id)===String(l.source_item_id)))issues.push(`Công thức món “${r.name}” có liên kết ${l.source_type==='raw'?'Kho Thô':'Thành phẩm'} không tồn tại.`);if(l.source_type==='fg'&&!sbEffectiveRecipe(sbCookRecipes,sbFgName(l.source_item_id)))issues.push(`Công thức món “${r.name}” dùng thành phẩm “${sbFgName(l.source_item_id)}” nhưng chưa có Công thức Nấu.`);}}
  const names=new Map();for(const r of [...sbCookRecipes,...sbDishRecipes]){const k=(r.name||'').trim().toLowerCase();names.set(k,(names.get(k)||0)+1);} 
  return `<div class="sb-integrity-summary"><b>${issues.length?'⚠️ Có '+issues.length+' điểm cần xử lý':'✓ Cấu trúc liên kết đang hợp lệ'}</b><span>Kiểm tra ${sbCookRecipes.length} công thức nấu · ${sbDishRecipes.length} công thức món</span></div>${issues.length?`<div class="sb-issue-list">${issues.map(x=>`<div>⚠️ ${sbEsc(x)}</div>`).join('')}</div>`:`<div class="sb-good">Không phát hiện liên kết mồ côi hoặc công thức món trỏ tới thành phẩm chưa có công thức nấu.</div>`}<div class="sb-flow"><span>Nguyên liệu</span><i>→</i><span>Công thức nấu</span><i>→</i><span>Thành phẩm</span><i>→</i><span>Công thức món</span><i>→</i><span>Fabi</span></div>`;
}
function recipeIntegrityView(){
  return recipeCenterView('integrity');
}

function sbFabiView(date=localDateKey()){
  if(!sbRoleOk())return ''; const rows=[...sbDishRecipes].filter(r=>r.active!==false).filter(r=>String(r.effective_from||'')<=date).sort((a,b)=>String(a.name).localeCompare(String(b.name),'vi'));
  const saved=sbFabiSales.filter(x=>x.sale_date===date); const map=new Map(saved.map(x=>[x.dish_recipe_id,x]));
  const html=rows.map(r=>`<div class="sb-fabi-row"><div><b>${sbEsc(r.name)}</b><small>v${r.version_no} · hiệu lực ${sbEsc(r.effective_from)}</small></div><input id="fabi_qty_${r.id}" type="number" min="0" step="1" value="${map.get(r.id)?.qty??''}" placeholder="0"><button onclick="sbShowDishTrace('${r.id}',${Number(map.get(r.id)?.qty||0)},'${date}')">Xem</button></div>`).join('');
  return `<div class="sb-modal-wrap"><div class="sb-modal-title"><div><h2>📊 Fabi · Đối soát bán hàng</h2><p>Nhập số món/size bán trong ngày. Hệ thống quy đổi ngược về thành phẩm và nguyên liệu gốc.</p></div><button class="sb-x" onclick="closeModal()">×</button></div><div class="sb-grid2"><label>Ngày đối soát<input id="sbFabiDate" type="date" value="${date}" onchange="openModal(sbFabiView(this.value))"></label><div class="sb-kpi"><span>Tổng dòng có dữ liệu</span><b>${saved.length}</b></div></div><div class="sb-form-hint">Fabi là lớp đối soát, không tự sửa tồn kho. Chênh lệch chỉ được kết luận sau khi so sánh lượng lý thuyết với Ledger/kiểm kê thực tế.</div>${html||'<div class="sb-empty">Chưa có Công thức Món để đối soát.</div>'}<div class="sb-footer"><button onclick="closeModal()">Đóng</button><button class="sb-primary" onclick="sbSaveFabi('${date}')">💾 Lưu số bán</button></div></div>`;
}
async function sbSaveFabi(date){
  const payload=[]; for(const r of sbDishRecipes.filter(r=>r.active!==false&&String(r.effective_from||'')<=date)){const el=document.getElementById('fabi_qty_'+r.id);if(!el||el.value==='')continue;const qty=Number(el.value);if(!Number.isFinite(qty)||qty<0)return showInventoryNotice('⚠️ Số bán không hợp lệ',`${r.name}: số bán phải từ 0.`);payload.push({id:sbId('fabi'),sale_date:date,dish_recipe_id:r.id,qty,created_at:sbNowIso(),created_by:currentUser.id||currentUser.username||''});}
  try{const {error:delErr}=await supabaseClient.from('sb_fabi_sales').delete().eq('sale_date',date);if(delErr)throw delErr;if(payload.length){const {error}=await supabaseClient.from('sb_fabi_sales').insert(payload);if(error)throw error;}await sbLoadBusinessData();openModal(sbFabiView(date));showSuccessToast('Đã lưu số bán Fabi.');}catch(e){showInventoryNotice('❌ CHƯA LƯU FABI',e.message||String(e));}
}
function sbShowDishTrace(recipeId,qty,date){const r=sbDishRecipes.find(x=>x.id===recipeId);if(!r)return;const res=sbDishCost(recipeId,qty||1);const rows=[...res.raw].filter(([k])=>k.startsWith('raw:')).map(([k,v])=>{const parts=k.split(':'); const id=parts[1],u=parts.slice(2).join(':')||raw.find(q=>String(q.id)===String(id))?.unit||''; const x=raw.find(q=>String(q.id)===String(id)); return `<div class="sb-trace-row"><span>${sbEsc(x?.name||id)}<small>${sbEsc(u)}</small></span><b>${fmt(v)} ${sbEsc(u)}</b><strong>${fmtMoney(sbCostOfRaw(id,v,u))}</strong></div>`}).join('');openModal(`<div class="sb-modal-wrap"><div class="sb-modal-title"><div><h2>🔎 Truy xuất · ${sbEsc(r.name)}</h2><p>${fmt(qty||1)} món · ngày ${sbEsc(date)}</p></div><button class="sb-x" onclick="openModal(sbFabiView('${date}'))">×</button></div><div class="sb-trace-card"><b>Lý thuyết nguyên liệu gốc</b>${rows||'<div class="sb-empty">Chưa đủ liên kết để truy xuất.</div>'}<div class="sb-total"><span>Giá vốn lý thuyết</span><b>${fmtMoney(res.cost)}</b></div></div><div class="sb-form-hint">Đây là lượng lý thuyết theo công thức có hiệu lực. Không tự ghi trừ kho.</div><div class="sb-footer"><button class="sb-primary" onclick="openModal(sbFabiView('${date}'))">Quay lại Fabi</button></div></div>`);}
