function formatDateOnly(ts) {
  if (!ts) return '';
  const d = new Date(Number(ts));
  if (Number.isNaN(d.getTime())) return '';
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
}
function getShelfLifeDays(item) {
  const n = Number(item?.shelf_life_days);
  return Number.isFinite(n) && n > 0 ? n : 0;
}
function getFGBatchDateStatus(item) {
  const shelfDays = getShelfLifeDays(item);
  if (!shelfDays) return null;
  const productions = logs
    .filter(l => l.tab === 'fg' && l.itemId === item.id && normalizeActionType(l) === 'production' && Number(l.qty || 0) > 0)
    .map(l => {
      const created = Number(l.timestamp || 0);
      const expiry = Number(l.expiresAt || 0) || (created ? created + shelfDays * 86400000 : 0);
      return { qty:Number(l.qty||0), timestamp:created, expiry };
    })
    .filter(b => b.timestamp > 0 && b.expiry > 0)
    .sort((a,b) => a.timestamp - b.timestamp);
  if (!productions.length) return null;

  const itemLogs = logs.filter(l => l.tab === 'fg' && l.itemId === item.id);
  const sold = itemLogs.filter(l => normalizeActionType(l) === 'sales').reduce((s,l)=>s+Number(l.qty||0),0);
  const waste = itemLogs.filter(l => normalizeActionType(l) === 'waste').reduce((s,l)=>s+Number(l.qty||0),0);
  const returned = itemLogs.filter(l => normalizeActionType(l) === 'return').reduce((s,l)=>s+Number(l.qty||0),0);
  let remainingConsumption = Math.max(0, sold + waste - returned);
  let active = [];
  for (const b of productions) {
    const consumed = Math.min(b.qty, remainingConsumption);
    remainingConsumption -= consumed;
    const remain = b.qty - consumed;
    if (remain > 1e-9) active.push({...b, remain});
  }
  if (!active.length) return null;

  const now = Date.now();
  const batch = active.reduce((old,b) => !old || b.expiry < old.expiry ? b : old, null);
  const totalMs = shelfDays * 86400000;
  const remainingMs = batch.expiry - now;
  const remainingDays = remainingMs / 86400000;
  const remainingRatio = remainingMs / totalMs;
  let level = 'normal';
  if (remainingMs <= 0) level = 'expired';
  else if (remainingDays <= 1) level = 'warn-1d';
  else if (remainingDays <= 2) level = 'warn-2d';
  else if (remainingRatio <= 0.5) level = 'warn-50';
  const label = level === 'expired' ? '⛔ QUÁ DATE' : level === 'warn-1d' ? '🔴 Cận date ≤ 1 ngày' : level === 'warn-2d' ? '🟠 Cận date ≤ 2 ngày' : level === 'warn-50' ? '🟡 Đã qua 50% hạn dùng' : '🟢 Còn hạn';
  return {level, label, expiry:batch.expiry, remain:batch.remain, remainingDays};
}
function fgDateClass(item) {
  const d = getFGBatchDateStatus(item);
  return d && d.level !== 'normal' ? `date-warn-${d.level === 'warn-50' ? '50' : d.level === 'warn-2d' ? '2d' : d.level === 'warn-1d' ? '1d' : 'expired'}` : '';
}
function fgDateBadge(item) {
  const d = getFGBatchDateStatus(item);
  if (!d) return '';
  const text = d.level === 'expired' ? d.label : `${d.label} · HSD ${formatDateOnly(d.expiry)}`;
  return `<div class="date-status ${d.level}">${text}</div>`;
}

}

function fgView() {
  const groups = ['Tất cả', ...getFGCategories()];
  const list = sortItemsForDisplay(fg.filter(x => (fgGroup === 'Tất cả' || x.category === fgGroup) && x.name.toLowerCase().includes(query.toLowerCase())));
  return `
    ${dateFilterView()}
    <div class="filter-wrapper"><div class="filter-scroll">${groups.map(g => `<button class="filter-chip ${fgGroup === g ? 'active' : ''}" onclick="fgGroup='${g}';render()">${g}</button>`).join('')}</div></div>
    <div class="card-list">${list.map((x) => {
      const s = getFGStatsByDate(x);
      return `
      <div class="inventory-card ${fgDateClass(x)}" onclick="openItemActions('fg',${fg.indexOf(x)})">
        <div class="card-head">
          <div><div class="item-name">${x.name}</div><div class="item-unit">ĐVT: ${x.unit}</div>${fgDateBadge(x)}</div>
          <div style="text-align:right"><span style="font-size:11px;color:var(--text-muted);display:block">Tồn Cuối</span><span class="stock-qty">${fmt(s.stock)}</span></div>
        </div>
        <div class="stock-stats grid-5">
          <div class="stat-box opening"><label>Tồn đầu</label><val>${fmt(s.opening)}</val></div>
          <div class="stat-box export"><label>Đã bán</label><val>${fmt(s.sales)}</val></div>
          <div class="stat-box import"><label>Nấu thêm</label><val>${fmt(s.production)}</val></div>
          <div class="stat-box return"><label>Thu hồi</label><val>${fmt(s.returned)}</val></div>
          <div class="stat-box waste"><label>Hủy</label><val>${fmt(s.waste)}</val></div>
        </div>
      </div>`;
    }).join('') || '<div class="empty-state">Chưa có dữ liệu thành phẩm.</div>'}
    </div>`;
}


function auditActionClass(log) {
  return normalizeActionType(log) || 'data_repair';
}
function auditActionLabel(log) {
  const type = normalizeActionType(log);
  const labels = {
    import: 'Nhập kho',
    export: 'Xuất kho',
    sales: 'Xuất bán',
    production: 'Nấu thêm',
    return: 'Thu hồi',
    waste: 'Hủy món',
    adjustment: String(log.action || 'Điều chỉnh tồn'),
    data_repair: 'Sửa dữ liệu lỗi cũ'
  };
  return labels[type] || String(log.action || 'Giao dịch');
}

function auditEditSummary(log) {
  if (!log.editedAt) return '';
  const detail = String(log.editDetail || '').trim();
  return detail || `Số lượng hiện tại: ${fmt(log.qty)} ${log.unit}`;
}

function auditView() {
  const filters = [
    ['Tất cả', 'Tất cả'],
    ['import', 'Nhập kho'],
    ['export', 'Xuất kho'],
    ['sales', 'Xuất bán'],
    ['production', 'Nấu thêm'],
    ['return', 'Thu hồi'],
    ['waste', 'Hủy món'],
    ['adjustment', 'Điều chỉnh tồn']
  ];
  const list = getFilteredLogs().filter(l => auditType === 'Tất cả' || normalizeActionType(l) === auditType);

  return `
    ${dateFilterView()}
    <div class="filter-wrapper">
      <div class="filter-scroll">
        ${filters.map(([value, label]) => `<button class="filter-chip ${auditType === value ? 'active' : ''}" onclick="auditType='${value}';render()">${label}</button>`).join('')}
      </div>
    </div>
    <div class="card-list">
      <div style="padding:14px;font-weight:700;background:#fff;border-radius:12px;border:1px solid var(--border-color);font-size:15px">📋 Lịch sử giao dịch Cloud</div>
      ${list.map(l => {
        const allowEdit = canEditLog(l);
        return `
        <div class="${l.editedAt ? 'audit-row-edited' : ''}" style="background:#fff;border-radius:12px;padding:12px 14px;border:1px solid var(--border-color)">
          <div style="font-size:12px;color:var(--text-muted);margin-bottom:4px"><b>${l.user}</b> · ${l.time}</div>
          <div style="font-size:14px;color:var(--text-main);margin-bottom:6px"><span class="audit-action ${auditActionClass(l)}">${auditActionLabel(l)}</span>: <b style="font-size:15px">${fmt(l.qty)} ${l.unit}</b> (${l.item})</div>
          ${l.editedAt ? `<div class="audit-edited-line"><span class="audit-change">→ ${auditEditSummary(l)}</span><span class="audit-edited-meta">✎ Đã sửa ${l.editedAt}</span></div>` : ''}
          <div style="display:flex;gap:12px;margin-top:${l.editedAt ? '7px' : '0'}">
            ${allowEdit ? `<button class="link-btn blue" onclick="editLog('${l.id}')">Sửa</button>` : ''}
            ${isOwnerRole() ? `<button class="link-btn red" onclick="deleteLog('${l.id}')">Xóa</button>` : ''}
          </div>
        </div>
      `}).join('') || '<div class="empty-state">Không có nhật ký thuộc loại này.</div>'}
    </div>`;
}

function render() {
  renderedDayKey = localDateKey();
  document.getElementById('root').innerHTML = !currentUser ? (needsInitialAdmin ? initialAdminSetupView() : loginView()) : `
    <div class="app-container">
      <header>
        <div class="header-top"><div><div class="shop-title">Quản Lý Kho SB</div><div class="user-info">Xin chào, <b>${currentUser.name}</b></div></div><div class="role-badge">${roleLabel(currentUser.role)}</div></div>
        <div class="location-badge-wrap"><div class="location-mini">📍 Điểm đang làm việc</div><button class="location-switch-btn" onclick="openLocationPicker()">${getCurrentLocation()?.name || 'Chưa chọn điểm bán'}${isOwnerRole()?' · Chạm để đổi':''}</button></div>
        ${isOwnerRole() ? `<div class="owner-tools"><button class="owner-tool-btn" onclick="openOwnerTool('inventory')">🧾 Kiểm kê</button><button class="owner-tool-btn" onclick="openOrdering()">↕️ Sắp xếp món</button></div>` : ''}
        <div class="header-actions">
          ${currentUser.role === 'admin' ? `
            <button onclick="openAdminHome()">⚙ Quản Trị</button>
          ` : ''}
          <button class="btn-logout" onclick="logout()">Thoát</button>
        </div>
      </header>
      <main>${page === 'raw' ? rawView() : page === 'finished' ? fgView() : auditView()}</main>
      <nav class="bottom-nav"><div class="nav-inner"><button class="nav-item ${page === 'raw' ? 'active' : ''}" onclick="setPage('raw')"><span class="nav-icon">📦</span>Kho Thô</button><button class="nav-item ${page === 'finished' ? 'active' : ''}" onclick="setPage('finished')"><span class="nav-icon">🥤</span>Thành Phẩm</button><button class="nav-item ${page === 'audit' ? 'active' : ''}" onclick="setPage('audit')"><span class="nav-icon">📄</span>Nhật Ký</button></div></nav>
    </div>
    <div class="modal-overlay" id="modal" onclick="if(event.target===this) closeModal()"><div class="bottom-sheet" id="sheet"></div></div>`;
}

// Khởi chạy ứng dụng
initSession();
fetchInitialData();
</script>
</body>
</html>
