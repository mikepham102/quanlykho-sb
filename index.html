}
function updateTableRowUI(tab,id){ const key=tableDraftKey(tab,id),d=tableDrafts[key]||{},btn=document.querySelector(`[data-save-key="${CSS.escape(key)}"]`),end=document.querySelector(`[data-stock-end-key="${CSS.escape(key)}"]`),has=Object.values(d).some(v=>Number(v)>0); if(btn){btn.classList.toggle('ready',has&&!tableSavingKey);btn.disabled=!has||!!tableSavingKey;btn.textContent=tableSavingKey===key?'⏳':'Lưu';} if(end){const item=(tab==='raw'?raw:fg).find(x=>sameLedgerItemId(x.id,id));if(item)end.textContent=fmt(tableStockEnd(tab,item));} }
async function saveTableRow(tab,id){ const key=tableDraftKey(tab,id); if(tableSavingKey)return; if(isDateFilterActive())return showInventoryNotice('📅 Đang xem báo cáo','Hãy bấm “Về hiện tại” trước khi nhập liệu.'); const arr=tab==='raw'?raw:fg,item=arr.find(x=>sameLedgerItemId(x.id,id)); if(!item)return showInventoryNotice('❌ Không tìm thấy mặt hàng','Mặt hàng không còn tồn tại trên màn hình.'); const d={...(tableDrafts[key]||{})}; const ops=(tab==='raw'?[{type:'import',qty:Number(d.import||0),actionName:'＋ Nhập kho'},{type:'export',qty:Number(d.export||0),actionName:'− Xuất kho'}]:[{type:'production',qty:Number(d.production||0),actionName:'＋ Nấu thêm'},{type:'sales',qty:Number(d.sales||0),actionName:'− Xuất bán'},{type:'return',qty:Number(d.return||0),actionName:'↩ Thu hồi'},{type:'waste',qty:Number(d.waste||0),actionName:'− Hủy món'}]).filter(o=>o.qty>0); if(!ops.length)return; tableSavingKey=key;updateTableRowUI(tab,id); try{ const itemTable=tab==='raw'?'raw_items':'fg_items'; const {data:freshItem,error:freshError}=await supabaseClient.from(itemTable).select('*').eq('id',item.id).maybeSingle(); if(freshError||!freshItem)throw new Error(freshError?.message||'Không tìm thấy dữ liệu mặt hàng trên Cloud.'); const {data:cloudLogs,error:logsError}=await supabaseClient.from('logs').select('*').eq('tab',tab); if(logsError)throw new Error(`Không thể đọc Nhật Ký Cloud: ${logsError.message||logsError}`); const freshLogs=(cloudLogs||[]).map(l=>({id:l.id,tab:l.tab,itemId:l.itemid,item:l.item,action:l.action,qty:Number(l.qty||0),unit:l.unit,before:Number(l.before||0),after:Number(l.after||0),actionType:l.actiontype,user:l.user,username:l.userid||'',timestamp:Number(l.timestamp||0),dateKey:l.datekey||'',editedAt:l.editedat||null,editedBy:l.editedby||null,time:l.time||''})); let stock=calculateStockFromLogs(tab,freshItem,freshLogs); if(stock< -1e-9)throw new Error(`Tồn Ledger của ${freshItem.name} đang âm. Hãy kiểm kê lại trước khi tiếp tục.`); const updated=JSON.parse(JSON.stringify(freshItem)),prepared=[]; for(const op of ops){ if(!validatePositiveQty(op.qty))throw new Error(`${op.actionName}: số lượng phải lớn hơn 0.`); if(isStockDecreasingAction(tab,op.type)&&op.qty>stock+1e-9)throw new Error(`Không đủ tồn kho để ${op.actionName.toLowerCase()}. Tồn hiện có: ${fmt(stock)} ${freshItem.unit}.`); const before=stock; if(tab==='raw'){if(op.type==='import')stock+=op.qty;else stock-=op.qty;}else{if(op.type==='production'||op.type==='return')stock+=op.qty;else stock-=op.qty;} applyDraftToItem(updated,tab,op.type,op.qty); if(stock< -1e-9)throw new Error(`${op.actionName} làm tồn kho âm.`); prepared.push({...op,before,after:stock}); }
 const now=Date.now(),userName=`${currentUser.name} (${roleLabel(currentUser.role)})`; const payload=prepared.map((p,i)=>({id:'log_'+now+'_'+Math.random().toString(36).slice(2,9)+'_'+i,tab,itemid:freshItem.id,item:freshItem.name,action:p.actionName,qty:p.qty,unit:freshItem.unit,before:p.before,after:p.after,actiontype:p.type,timestamp:now+i,datekey:localDateKey(),userid:currentUser.id||currentUser.username||'',user:userName,time:dateTime(),editedat:null,editedby:null})); const {error:insertError}=await supabaseClient.from('logs').insert(payload); if(insertError)throw new Error(`Không thể ghi Nhật Ký Cloud: ${insertError.message||insertError}`); const {error:itemError}=await supabaseClient.from(itemTable).update(updated).eq('id',freshItem.id); if(itemError)console.warn('Không cập nhật được cột tổng; Ledger vẫn dùng Log Cloud:',itemError.message||itemError); const localItem=arr.find(x=>sameLedgerItemId(x.id,id));if(localItem)Object.assign(localItem,updated); const localLogs=payload.map(l=>({...l,itemId:l.itemid,actionType:l.actiontype,userId:l.userid,username:currentUser.username||'',dateKey:l.datekey,editedAt:null,editedBy:null,editDetail:'',time:l.time})); logs=[...localLogs,...logs];sortLogsNewestFirst();saveLocalState();clearTableDraft(tab,id);render();showSuccessToast(`${prepared.length} giao dịch đã được ghi nhận`); }catch(err){ console.error('Lỗi lưu bảng:',err);showInventoryNotice('❌ CHƯA LƯU ĐƯỢC',`${err.message||err}\n\nDữ liệu trên dòng chưa được ghi nhận.`); }finally{tableSavingKey='';} }
function tableHeader(tab){ return tab==='raw'?`<thead><tr><th><div id="tableActiveGroup">Tất cả</div></th><th>Tồn đầu</th><th>Nhập kho</th><th>Xuất kho</th><th>Tồn kho</th><th>Xác nhận</th></tr></thead>`:`<thead><tr><th><div id="tableActiveGroup">Tất cả</div></th><th>Tồn đầu</th><th>Nấu thêm</th><th>Xuất bán</th><th>Thu hồi</th><th>Hủy</th><th>Tồn cuối</th><th>Xác nhận</th></tr></thead>`; }
function tableRowRaw(item,report){ const key=tableDraftKey('raw',item.id),s=tableCurrentStats('raw',item); return `<tr class="data-row"><td><div class="item-cell-name">${tableEsc(item.name)}</div><div class="item-cell-unit">ĐVT: ${tableEsc(item.unit)}</div></td><td><div class="stock-static">${fmt(s.opening)}</div></td><td>${tableCellInput('raw',item,'import',report)}</td><td>${tableCellInput('raw',item,'export',report)}</td><td><div data-stock-end-key="${tableEsc(key)}" style="font-size:17px;font-weight:900;color:#0284c7">${fmt(tableStockEnd('raw',item))}</div></td><td><button type="button" data-save-key="${tableEsc(key)}" class="entry-save ${tableDraftHasData('raw',item.id)&&!report?'ready':''}" ${report||!tableDraftHasData('raw',item.id)?'disabled':''} onclick="saveTableRow('raw','${tableEsc(item.id)}')">Lưu</button></td></tr>`; }
function tableRowFG(item,report){ const key=tableDraftKey('fg',item.id),s=tableCurrentStats('fg',item); return `<tr class="data-row"><td><div class="item-cell-name">${tableEsc(item.name)}</div><div class="item-cell-unit">ĐVT: ${tableEsc(item.unit)}</div></td><td><div class="stock-static">${fmt(s.opening)}</div></td><td>${tableCellInput('fg',item,'production',report)}</td><td>${tableCellInput('fg',item,'sales',report)}</td><td>${tableCellInput('fg',item,'return',report)}</td><td>${tableCellInput('fg',item,'waste',report)}</td><td><div data-stock-end-key="${tableEsc(key)}" style="font-size:17px;font-weight:900;color:#0284c7">${fmt(tableStockEnd('fg',item))}</div></td><td><button type="button" data-save-key="${tableEsc(key)}" class="entry-save ${tableDraftHasData('fg',item.id)&&!report?'ready':''}" ${report||!tableDraftHasData('fg',item.id)?'disabled':''} onclick="saveTableRow('fg','${tableEsc(item.id)}')">Lưu</button></td></tr>`; }
function tableView(tab){ const report=isDateFilterActive(),arr=tab==='raw'?raw:fg,groupGetter=tab==='raw'?(x=>x.group):(x=>x.category),selected=tab==='raw'?rawGroup:fgGroup,filtered=sortItemsForDisplay(arr.filter(x=>(selected==='Tất cả'||groupGetter(x)===selected)&&String(x.name||'').toLowerCase().includes(String(query||'').toLowerCase()))),rows=[],groups=tab==='raw'?['Tất cả','HỒNG PHÁT','TNT','BAO BÌ','Khác']:['Tất cả','Đồ uống','Topping','Khác']; let last=null; for(const item of filtered){const g=groupGetter(item)||'Khác';if(g!==last){rows.push(`<tr class="group-row" data-group="${tableEsc(g)}"><td><div class="group-label"><span class="group-dot"></span>${tableEsc(g)}</div></td>${tab==='raw'?'<td colspan="5"></td>':'<td colspan="7"></td>'}</tr>`);last=g;}rows.push(tab==='raw'?tableRowRaw(item,report):tableRowFG(item,report));} const note=report?'📅 Đang xem lại dữ liệu — các ô Nhập/Xuất/Nấu thêm/Bán/Thu hồi/Hủy hiển thị tổng biến động thực tế của kỳ đã chọn, chỉ xem. Bấm “Về hiện tại” để nhập liệu.':'📌 Ngày hiện tại: các ô biến động hiển thị số đã ghi thực tế trong hôm nay. Bấm vào ô để nhập thêm; số mới sẽ cộng vào tổng hôm nay. Tồn đầu và Tồn cuối do hệ thống tự tính.'; return `${dateFilterView()}<div class="filter-wrapper"><div class="filter-scroll">${groups.map(g=>`<button class="filter-chip ${selected===g?'active':''}" onclick="${tab==='raw'?'rawGroup':'fgGroup'}='${tableEsc(g)}';render()">${tableEsc(g)}</button>`).join('')}</div></div><div class="entry-help">${note}</div><div class="table-entry-wrap"><div class="table-scroll"><table class="entry-table">${tableHeader(tab)}<tbody>${rows.join('')||`<tr><td colspan="${tab==='raw'?6:8}" class="table-empty">Chưa có dữ liệu.</td></tr>`}</tbody></table></div></div>` + (requestAnimationFrame(initTableStickyGroup), ""); }

// VIEWS
function loginView() {
  return `<div class="login-wrapper"><div class="login-card"><div class="login-brand">🧋</div><h1 style="text-align:center;color:var(--brand-blue);font-size:22px;margin-bottom:4px">Quản Lý Kho SB</h1><div style="text-align:center;color:var(--text-muted);font-size:13px;margin-bottom:20px">Đăng nhập hệ thống kho Cloud</div><div class="form-group"><label>Tên đăng nhập</label><input id="loginUser" placeholder="Nhập username..."></div><div class="form-group"><label>Mật khẩu</label><input id="loginPass" type="password" placeholder="••••••"></div><button class="btn-primary" onclick="login()">ĐĂNG NHẬP</button><div id="loginError" style="color:var(--danger-color);font-size:12px;margin-top:10px;text-align:center;display:none"></div></div></div>`;
}

function rawView(){ return tableView('raw'); }

function fgView(){ return tableView('fg'); }


function auditActionClass(log) {
  return normalizeActionType(log) || 'data_repair';
}
function auditActionLabel(log) {
  const type = normalizeActionType(log);
  const labels = {
    import: 'Nhập kho',
    export: 'Xuất kho',
    sales: 'Xuất bán',
    production: 'Nấu thêm',
    return: 'Thu hồi',
    waste: 'Hủy món',
    stocktake: 'Kiểm kê',
    data_repair: 'Sửa dữ liệu lỗi cũ'
  };
  return labels[type] || String(log.action || 'Giao dịch');
}

function auditEditSummary(log) {
  if (!log.editedAt) return '';
  const detail = String(log.editDetail || '').trim();
  return detail || `Số lượng hiện tại: ${fmt(log.qty)} ${log.unit}`;
}

function getAuditItemGroup(log) {
  const item = (log?.tab === 'raw' ? raw : fg).find(x => x.id === log?.itemId);
  return String(item?.group || item?.category || 'Khác').trim() || 'Khác';
}

function auditView() {
  const filters = [
    ['Tất cả', 'Tất cả'],
    ['import', 'Nhập kho'],
    ['export', 'Xuất kho'],
    ['sales', 'Xuất bán'],
    ['production', 'Nấu thêm'],
    ['return', 'Thu hồi'],
    ['waste', 'Hủy món'],
  ];
  const groupSet = new Set();
  raw.forEach(x => groupSet.add(String(x.group || 'Khác').trim() || 'Khác'));
  fg.forEach(x => groupSet.add(String(x.category || 'Khác').trim() || 'Khác'));
  const groups = ['Tất cả', ...Array.from(groupSet).filter(g => g !== 'Tất cả').sort((a,b) => a.localeCompare(b, 'vi'))];
  const list = getFilteredLogs().filter(l => {
    const typeOk = auditType === 'Tất cả' || normalizeActionType(l) === auditType;
    const groupOk = auditGroup === 'Tất cả' || getAuditItemGroup(l) === auditGroup;
    return typeOk && groupOk;
  });

  return `
    ${dateFilterView()}
    <div class="filter-wrapper">
      <div style="font-size:11px;font-weight:800;color:var(--text-muted);margin:0 0 6px 2px;text-transform:uppercase">Phân loại thao tác</div>
      <div class="filter-scroll">
        ${filters.map(([value, label]) => `<button class="filter-chip ${auditType === value ? 'active' : ''}" onclick="auditType='${value}';render()">${label}</button>`).join('')}
      </div>
      <div style="font-size:11px;font-weight:800;color:var(--text-muted);margin:10px 0 6px 2px;text-transform:uppercase">Nhóm nguyên liệu</div>
      <div class="filter-scroll">
        ${groups.map(g => `<button class="filter-chip ${auditGroup === g ? 'active' : ''}" onclick="auditGroup='${g}';render()">${g}</button>`).join('')}
      </div>
    </div>
    <div class="card-list">
      <div style="padding:14px;font-weight:700;background:#fff;border-radius:12px;border:1px solid var(--border-color);font-size:15px">📋 Lịch sử giao dịch Cloud</div>
      ${list.map(l => {
        const allowEdit = canEditLog(l);
        const itemGroup = getAuditItemGroup(l);
        return `
        <div class="audit-transaction-card ${l.editedAt ? 'audit-row-edited' : ''}">
          <div class="audit-topline">
            <div class="audit-employee">${l.user}</div>
            <div class="audit-time">${l.time}</div>
          </div>
          <div class="audit-detail-row">
            <div class="audit-item-name">${l.item}</div>
            <span class="audit-status ${auditActionClass(l)}">${auditActionLabel(l)}</span>
          </div>
          <div class="audit-divider"></div>
          <div class="audit-detail-row">
            <div class="audit-group-name">${itemGroup}</div>
            <div class="audit-qty">${fmt(l.qty)} <span class="unit">${l.unit}</span></div>
          </div>
          ${l.editedAt ? `<div class="audit-edited-line"><span class="audit-change">→ ${auditEditSummary(l)}</span><span class="audit-edited-meta">✎ Đã sửa ${l.editedAt}</span></div>` : ''}
          <div style="display:flex;gap:12px;margin-top:${l.editedAt ? '7px' : '9px'}">
            ${allowEdit ? `<button class="link-btn blue" onclick="editLog('${l.id}')">Sửa</button>` : ''}
            ${isOwnerRole() ? `<button class="link-btn red" onclick="deleteLog('${l.id}')">Xóa</button>` : ''}
          </div>
        </div>
      `}).join('') || '<div class="empty-state">Không có nhật ký phù hợp với bộ lọc.</div>'}
    </div>`;
}

function render() {
  renderedDayKey = localDateKey();
  document.getElementById('root').innerHTML = !currentUser ? loginView() : `
    <div class="app-container">
      <header>
        <div class="header-top"><div><div class="shop-title">Quản Lý Kho SB</div><div class="user-info">Xin chào, <b>${currentUser.name}</b></div></div><div class="role-badge">${roleLabel(currentUser.role)}</div></div>
        ${isOwnerRole() ? `<div class="owner-tools"><button class="owner-tool-btn" onclick="openOwnerTool('reconcile')">📊 Đối chiếu Fabi</button><button class="owner-tool-btn" onclick="openOwnerTool('inventory')">🧾 Kiểm kê</button><button class="owner-tool-btn" onclick="openOrdering()">↕️ Sắp xếp món</button></div>` : ''}
        <div class="header-actions">
          ${currentUser.role === 'admin' ? `
            <button onclick="openAdmin('location')">⚙ GPS Quán</button>
            <button onclick="openAdmin('accounts')">👥 Nhân Viên</button>
            <button onclick="openAdmin('items')">🧾 Mặt Hàng</button>
          ` : ''}
          <button class="btn-logout" onclick="logout()">Thoát</button>
        </div>
      </header>
      <main>${page === 'raw' ? rawView() : page === 'finished' ? fgView() : auditView()}</main>
      <nav class="bottom-nav"><div class="nav-inner"><button class="nav-item ${page === 'raw' ? 'active' : ''}" onclick="setPage('raw')"><span class="nav-icon">📦</span>Kho Thô</button><button class="nav-item ${page === 'finished' ? 'active' : ''}" onclick="setPage('finished')"><span class="nav-icon">🥤</span>Thành Phẩm</button><button class="nav-item ${page === 'audit' ? 'active' : ''}" onclick="setPage('audit')"><span class="nav-icon">📄</span>Nhật Ký</button></div></nav>
    </div>
    <div class="modal-overlay" id="modal" onclick="if(event.target===this) closeModal()"><div class="bottom-sheet" id="sheet"></div></div>`;

  if (currentUser && (page === 'raw' || page === 'finished')) requestAnimationFrame(initTableStickyGroup);
}

// Khởi chạy ứng dụng
initSession();
fetchInitialData();
</script>
