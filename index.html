<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Quản Lý Kho SB</title>
  <meta name="theme-color" content="#0b63ce">
  <meta name="apple-mobile-web-app-title" content="Quản Lý Kho SB">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <style>
    :root {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --brand-blue: #0097d2;
      --brand-blue-dark: #007bb0;
      --brand-yellow: #ffd21c;
      --danger-color: #ef4444;
      --border-color: #e2e8f0;
      --radius-lg: 16px;
      --radius-md: 10px;

      /* Màu sắc định danh các thẻ kho */
      --bg-opening: #f1f5f9; --text-opening: #475569;
      --bg-import: #dcfce7;  --text-import: #15803d;  /* Nhập / Nấu thêm */
      --bg-export: #e0f2fe;  --text-export: #0369a1;  /* Xuất / Đã bán */
      --bg-return: #f3e8ff;  --text-return: #6b21a8;  /* Thu hồi */
      --bg-waste: #ffe4e6;   --text-waste: #be123c;   /* Hủy / Hao hụt */
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      /* Khoảng trống cuối trang được đặt ở main để nội dung thực sự cuộn vượt qua bottom nav. */
      padding-bottom: 0;
    }
    .app-container { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; }

    /* Header */
    header { background: linear-gradient(135deg, var(--brand-blue), var(--brand-blue-dark)); color: #fff; padding: 18px 16px 14px; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; box-shadow: 0 4px 15px rgba(0,151,210,0.25); }
    .header-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .shop-title { font-size: 20px; font-weight: 800; letter-spacing: -0.3px; }
    .user-info { font-size: 13px; opacity: 0.92; margin-top: 3px; font-weight: 500; }
    .role-badge { background: var(--brand-yellow); color: #1e293b; font-weight: 800; font-size: 11px; padding: 4px 10px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.5px; }

    .header-actions { display: flex; gap: 8px; margin-top: 14px; overflow-x: auto; padding-bottom: 2px; }
    .header-actions button { background: rgba(255,255,255,0.22); color: #fff; border: 1px solid rgba(255,255,255,0.3); padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; backdrop-filter: blur(4px); }
    .header-actions button.btn-logout { background: rgba(239, 68, 68, 0.85); border: none; }

    /* Content */
    main { padding: 14px 14px calc(112px + env(safe-area-inset-bottom, 0px)); }
    .filter-wrapper { margin-bottom: 12px; }
    .filter-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .filter-scroll::-webkit-scrollbar { display: none; }
    .filter-chip { background: #fff; border: 1px solid var(--border-color); padding: 7px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; color: var(--text-muted); white-space: nowrap; cursor: pointer; }
    .filter-chip.active { background: var(--brand-blue); color: #fff; border-color: var(--brand-blue); box-shadow: 0 2px 6px rgba(0,151,210,0.3); }

    .search-box { width: 100%; padding: 12px 16px; border: 1px solid var(--border-color); border-radius: var(--radius-md); font-size: 14px; margin-bottom: 14px; background: #fff; outline: none; }

    /* Card UI */
    .card-list { display: flex; flex-direction: column; gap: 12px; }
    .inventory-card { background: var(--card-bg); border-radius: var(--radius-lg); border: 1px solid var(--border-color); padding: 14px; text-align: left; width: 100%; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
    .card-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .item-name { font-weight: 800; font-size: 17px; color: var(--text-main); }
    .item-unit { font-size: 13px; color: var(--text-muted); margin-top: 2px; font-weight: 500; }
    .stock-qty { font-weight: 800; font-size: 18px; color: var(--brand-blue); }

    /* Lưới các thông số tồn kho */
    .stock-stats { display: grid; gap: 6px; }
    .stock-stats.grid-3 { grid-template-columns: repeat(3, 1fr); }
    .stock-stats.grid-5 { grid-template-columns: repeat(3, 1fr); }

    .stat-box { text-align: center; padding: 6px 4px; border-radius: 8px; }
    .stat-box label { font-size: 11px; display: block; margin-bottom: 2px; font-weight: 700; text-transform: uppercase; }
    .stat-box val { font-size: 15px; font-weight: 800; display: block; }

    .stat-box.opening { background: var(--bg-opening); color: var(--text-opening); }
    .stat-box.import  { background: var(--bg-import);  color: var(--text-import); }
    .stat-box.export  { background: var(--bg-export);  color: var(--text-export); }
    .stat-box.return  { background: var(--bg-return);  color: var(--text-return); }
    .stat-box.waste   { background: var(--bg-waste);   color: var(--text-waste); }

    /* Màu nhận diện loại giao dịch trong Nhật Ký — đồng bộ với thẻ Kho */
    .audit-action { display:inline-block; padding:3px 7px; border-radius:7px; font-weight:800; font-size:13px; line-height:1.2; }
    .audit-action.import, .audit-action.production { background:var(--bg-import); color:var(--text-import); }
    .audit-action.export, .audit-action.sales { background:var(--bg-export); color:var(--text-export); }
    .audit-action.return { background:var(--bg-return); color:var(--text-return); }
    .audit-action.waste { background:var(--bg-waste); color:var(--text-waste); }
    .audit-action.data_repair { background:var(--bg-opening); color:var(--text-opening); }

    /* Nhật ký: tag tên món + nhóm nguyên liệu nổi bật, dễ quét trên mobile */
    .audit-item-tag { display:inline-flex; align-items:center; max-width:100%; padding:5px 10px; border-radius:9px; background:#eff6ff; color:#075985; border:1px solid #bae6fd; font-size:15px; font-weight:850; line-height:1.25; box-shadow:0 1px 2px rgba(15,23,42,.05); }
    .audit-item-group { display:inline-flex; align-items:center; padding:3px 8px; margin-left:6px; border-radius:999px; background:#f8fafc; color:#475569; border:1px solid #e2e8f0; font-size:10px; font-weight:800; vertical-align:middle; }

    /* Nhật ký đã chỉnh sửa: nổi bật toàn bộ dòng + ghi rõ nội dung thay đổi */
    .audit-row-edited { background:#fff7ed !important; border:1px solid #fdba74 !important; box-shadow:0 2px 8px rgba(234,88,12,.10); }
    .audit-edited-line { display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; margin-top:4px; font-size:12px; color:#9a3412; font-weight:800; }
    .audit-change { color:#9a3412; }
    .audit-edited-meta { margin-left:auto; white-space:nowrap; color:#c2410c; }
    /* Nhật Ký — thẻ giao dịch 2 bên, rõ người / mặt hàng / trạng thái */
    .audit-transaction-card { background:#fff; border-radius:16px; padding:13px 14px; border:1px solid #d8e7f0; box-shadow:0 3px 12px rgba(15,23,42,.06); }
    .audit-topline { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
    .audit-employee { color:#f8fafc; background:linear-gradient(135deg,#0f3d5e,#075985); padding:7px 11px; border-radius:10px; font-size:13px; font-weight:900; line-height:1.15; box-shadow:0 2px 5px rgba(7,89,133,.18); }
    .audit-time { color:#64748b; font-size:16px; font-weight:800; white-space:nowrap; }
    .audit-detail-row { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:28px; }
    .audit-item-name { min-width:0; flex:1; color:#102a43; font-size:16px; background: linear-gradient(82deg, #fdba74, #dbe0e2); font-weight:850; line-height:1.25; }
    .audit-status { flex:0 0 auto; font-size:14px; font-weight:900; padding:5px 9px; border-radius:9px; line-height:1.1; white-space:nowrap; }
    .audit-status.import,.audit-status.production { background:#dcfce7; color:#166534; border:1px solid #86efac; }
    .audit-status.export,.audit-status.sales,.audit-status.waste { background:#dbeafe; color:#075985; border:1px solid #7dd3fc; }
    .audit-status.return { background:#fef3c7; color:#92400e; border:1px solid #fcd34d; }
    .audit-status.stocktake,.audit-status.data_repair { background:#f1f5f9; color:#334155; border:1px solid #cbd5e1; }
    .audit-group-name { color:#991b1b; font-size:16px; font-weight:850; }
    .audit-qty { color:#0f172a; font-size:16px; font-weight:900; white-space:nowrap; }
    .audit-qty .unit { color:#475569; font-size:12px; font-weight:850; }
    .audit-divider { height:1px; background:#edf2f7; margin:7px 0; }


    /* Nav */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #fff;
      border-top: 1px solid var(--border-color);
      box-shadow: 0 -4px 20px rgba(0,0,0,0.06);
      z-index: 99;
      /* Safari iPhone: phần trắng phía dưới nằm trong safe-area */
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .nav-inner { max-width: 480px; margin: 0 auto; display: flex; justify-space-around: space-around; }
    .nav-item { background: none; border: none; padding: 10px 0 8px; font-size: 11px; color: var(--text-muted); font-weight: 600; cursor: pointer; flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .nav-item .nav-icon { font-size: 20px; }
    .nav-item.active {background-color: #0097d2; color:#fff; font-weight: 700; }


    /* ===== Công cụ chủ quán: Đối chiếu & Kiểm kê ===== */
    .owner-tools { display:flex; gap:8px; margin-top:10px; overflow-x:auto; padding-bottom:2px; }
    .owner-tool-btn { flex:1; min-width:128px; background:#fff; color:var(--brand-blue-dark); border:1px solid rgba(255,255,255,.65); padding:8px 10px; border-radius:10px; font-size:12px; font-weight:800; cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.08); }
    .tool-summary { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin:10px 0 12px; }
    .tool-summary-box { background:#fff; border:1px solid var(--border-color); border-radius:10px; padding:9px 6px; text-align:center; }
    .tool-summary-box small { display:block; color:var(--text-muted); font-size:10px; font-weight:700; }
    .tool-summary-box b { display:block; margin-top:2px; font-size:16px; }
    .reconcile-row,.count-row { background:#fff; border:1px solid var(--border-color); border-radius:12px; padding:10px 11px; margin-bottom:8px; }
    .reconcile-head,.count-head { display:flex; justify-content:space-between; gap:8px; align-items:flex-start; }
    .tool-name { font-weight:800; font-size:14px; }
    .tool-unit { color:var(--text-muted); font-size:11px; margin-top:2px; }
    .tool-metrics { display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px; margin-top:8px; }
    .tool-metric { background:#f8fafc; border-radius:8px; padding:6px 4px; text-align:center; }
    .tool-metric span { display:block; color:var(--text-muted); font-size:9px; font-weight:700; }
    .tool-metric b { display:block; font-size:13px; margin-top:2px; }
    .tool-input { width:100%; padding:8px 6px; border:1px solid var(--border-color); border-radius:8px; text-align:center; font-size:14px; font-weight:800; background:#fff; }
    .diff-zero { color:#15803d; } .diff-plus { color:#b45309; } .diff-minus { color:#dc2626; }
    .tool-section-title { font-size:13px; font-weight:800; margin:14px 0 8px; color:var(--text-main); }
    .tool-note { background:#f0f9ff; border:1px solid #bae6fd; color:#0369a1; border-radius:10px; padding:9px 10px; font-size:11px; line-height:1.45; margin:8px 0 12px; }
    .tool-danger { background:#fff7ed; border-color:#fed7aa; color:#9a3412; }

    /* Login */
    .login-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: linear-gradient(135deg, var(--brand-blue), var(--brand-blue-dark)); }
    .login-card { background: #fff; padding: 28px 24px; border-radius: 20px; width: 100%; max-width: 360px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); }
    .login-brand { font-size: 48px; text-align: center; margin-bottom: 6px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { font-size: 12px; font-weight: 700; color: var(--text-muted); display: block; margin-bottom: 6px; text-transform: uppercase; }
    .form-group input, .form-group select { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 10px; font-size: 14px; outline: none; background: #f8fafc; }
    button.btn-primary { width: 100%; background: var(--brand-blue); color: #fff; border: none; padding: 13px; border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer; margin-top: 10px; }
    button.btn-secondary { width: 100%; background: #0f172a; color: #fff; border: none; padding: 12px; border-radius: 10px; font-weight: 700; font-size: 14px; cursor: pointer; margin-top: 6px; }

    /* Modal Popup */
    .modal-overlay { 
      position: fixed; inset: 0; 
      background: rgba(15, 23, 42, 0.6); 
      display: flex; align-items: center; justify-content: center; 
      z-index: 1000; backdrop-filter: blur(4px); 
      padding: 16px;
      opacity: 0; visibility: hidden;
      transition: opacity 0.25s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .modal-overlay.show { opacity: 1; visibility: visible; }
    .bottom-sheet { 
      background: #fff; width: 100%; max-width: 420px; 
      border-radius: 24px; padding: 24px; max-height: 85vh; overflow-y: auto; 
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      transform: scale(0.92) translateY(10px);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .modal-overlay.show .bottom-sheet { transform: scale(1) translateY(0); }

    .action-tabs { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
    .action-tab { flex: 1; min-width: 45%; padding: 12px; border: 1px solid var(--border-color); border-radius: 10px; background: #fff; font-size: 13px; font-weight: 700; cursor: pointer; text-align: center; color: var(--text-muted); transition: all 0.2s ease; }
    .action-tab.active { background: var(--brand-blue); color: #fff; border-color: var(--brand-blue); }
    .modal-buttons { display: flex; gap: 10px; margin-top: 16px; }
    .modal-buttons button { flex: 1; padding: 12px; border-radius: 10px; font-weight: 700; cursor: pointer; border: none; font-size: 14px; }
    .modal-buttons .btn-cancel { background: var(--bg-color); color: var(--text-main); }
    .modal-buttons .btn-save { background: var(--brand-blue); color: #fff; }
    .inventory-actions { position: sticky; bottom: -24px; z-index: 20; display:flex; flex-wrap:wrap; gap:10px; margin:16px -24px -24px; padding:12px 24px calc(12px + env(safe-area-inset-bottom, 0px)); background:rgba(255,255,255,.96); border-top:1px solid var(--border-color); box-shadow:0 -8px 20px rgba(15,23,42,.08); backdrop-filter:blur(8px); }
    .inventory-actions button { flex:1 1 calc(50% - 5px); min-height:46px; padding:12px; border-radius:12px; font-weight:800; cursor:pointer; border:none; font-size:14px; }
    .inventory-actions .inventory-close { background:var(--bg-color); color:var(--text-main); }
    .inventory-actions .inventory-save { background:var(--brand-blue); color:#fff; }
    .inventory-actions .inventory-adjust { flex-basis:100%; background:#fff7ed; color:#9a3412; border:1px solid #fdba74; }
    .inventory-actions .inventory-adjust { flex-basis:100%; width:100%; background:var(--text-main); color:#fff; position:relative; z-index:100; pointer-events:auto; touch-action:manipulation; }
    .success-toast {
      position: fixed;
      top: calc(16px + env(safe-area-inset-top, 0px));
      right: 16px;
      z-index: 3000;
      max-width: min(360px, calc(100vw - 32px));
      padding: 11px 15px;
      border-radius: 12px;
      background: #dc2626;
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.35;
      box-shadow: 0 8px 24px rgba(15,23,42,.18);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      opacity: 0;
      transform: translateY(-8px);
      transition: opacity .2s ease, transform .2s ease;
      pointer-events: none;
    }
    .success-toast.show { opacity: .94; transform: translateY(0); }

    .empty-state { padding: 40px 20px; text-align: center; color: var(--text-muted); font-size: 14px; background: #fff; border-radius: var(--radius-lg); border: 1px dashed var(--border-color); }
    
    .link-btn { background: none; border: none; font-size: 12px; cursor: pointer; font-weight: 700; }
    .link-btn.blue { color: var(--brand-blue); }
    .link-btn.red { color: var(--danger-color); }
    .notice-box { background: #e0f2fe; color: #0369a1; padding: 12px; border-radius: 10px; font-size: 13px; margin-bottom: 14px; line-height: 1.4; }

    /* CSS cho danh sách Lưu tạm */
    .temp-list-box { background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 12px; padding: 10px; margin-top: 14px; }
    .temp-item-row { display: flex; justify-content: space-between; align-items: center; background: #fff; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border-color); margin-top: 6px; font-size: 13px; }

<script>
  // Hong/Quản Lý Kho SB - cache/version bootstrap for iPhone Home Screen WebApp
  // Tăng BUILD_VERSION mỗi lần deploy index.html mới.
  const BUILD_VERSION = 'SB-V5';
  const VERSION_KEY = 'sb_app_build_version';
  try {
    const oldVersion = localStorage.getItem(VERSION_KEY);
    localStorage.setItem(VERSION_KEY, BUILD_VERSION);
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js?v=' + encodeURIComponent(BUILD_VERSION), {scope: './'})
          .then(reg => {
            // Ask an updated worker to activate immediately when available.
            if (reg.waiting) reg.waiting.postMessage({type:'SKIP_WAITING'});
            reg.addEventListener('updatefound', () => {
              const worker = reg.installing;
              if (!worker) return;
              worker.addEventListener('statechange', () => {
                if (worker.state === 'installed' && navigator.serviceWorker.controller) {
                  worker.postMessage({type:'SKIP_WAITING'});
                }
              });
            });
          })
          .catch(err => console.warn('Service Worker update check failed:', err));
      });
    }
  } catch (e) { console.warn('Version bootstrap unavailable:', e); }
</script>

<div id="root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
// ==========================================
// 1. THÔNG TIN SUPABASE CLOUD
// ==========================================
const SUPABASE_URL = 'https://kyhbgzaudgzwwvxtetsv.supabase.co'; 
const SUPABASE_KEY = 'sb_publishable_V-ldzvRj-UpMP49uXmBHLg_dOtd2Png';
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ==========================================
// 2. BIẾN TOÀN CỤC
// ==========================================
const SESSION_TIMEOUT = 30 * 60 * 1000; // 30 phút không thao tác
const SESSION_USER_KEY = 'awan_user';
const SESSION_ACTIVITY_KEY = 'awan_last_activity';
const SESSION_LOCATION_KEY = 'awan_staff_location_verified';

let currentUser = null;
let shopLocation = null;
let page = 'raw';
let dateFilterStart = '';
let dateFilterEnd = '';
let dateFilterOpen = false;
let query = '';
let rawGroup = 'Tất cả';
let fgGroup = 'Tất cả';
let auditType = 'Tất cả';
let auditGroup = 'Tất cả';
let fabiRecords = {};
let inventorySearch = '';
let inventoryTab = 'all';
let inventoryCounts = {};
let draftItem = null;
let draftTab = null;
let editLogId = null;
let editingItemId = null;
let tempDraftList = []; // Mảng chứa danh sách thao tác lưu tạm
let transactionSaving = false; // Khóa giao dịch ngay khi bấm Xác nhận Lưu
let inventorySaving = false; // Khóa kiểm kê để không ghi trùng log
let orderingTab = 'raw';

let accounts = [];
let raw = [];
let fg = [];
let logs = [];

// ==========================================
// 3. TẢI VÀ ĐỒNG BỘ DỮ LIỆU
// ==========================================
function sortLogsNewestFirst() {
  logs.sort((a, b) => (Number(b.timestamp) || 0) - (Number(a.timestamp) || 0) || String(b.id).localeCompare(String(a.id)));
  return logs;
}

async function fetchInitialData() {
  try {
    const [accRes, rawRes, fgRes, logRes, configRes] = await Promise.all([
      supabaseClient.from('accounts').select('*'),
      supabaseClient.from('raw_items').select('*'),
      supabaseClient.from('fg_items').select('*'),
      supabaseClient.from('logs').select('*').order('timestamp', { ascending: false }).order('id', { ascending: false }),
      supabaseClient.from('config').select('*').in('key', ['shop_location','fabi_reconcile'])
    ]);

    // Không được âm thầm dùng localStorage nếu Cloud trả lỗi.
    // Nhật Ký là nguồn sự thật của Ledger; nếu đọc logs lỗi thì phải báo lỗi rõ ràng,
    // không được render dữ liệu cũ như thể đó là dữ liệu Cloud mới nhất.
    if (accRes.error) throw new Error(`Không thể tải tài khoản từ Cloud: ${accRes.error.message || accRes.error}`);
    if (rawRes.error) throw new Error(`Không thể tải Kho Thô từ Cloud: ${rawRes.error.message || rawRes.error}`);
    if (fgRes.error) throw new Error(`Không thể tải Thành phẩm từ Cloud: ${fgRes.error.message || fgRes.error}`);
    if (logRes.error) throw new Error(`Không thể tải Nhật Ký từ Cloud: ${logRes.error.message || logRes.error}`);
    if (configRes.error) throw new Error(`Không thể tải cấu hình từ Cloud: ${configRes.error.message || configRes.error}`);

    if (accRes.data) accounts = accRes.data;
    if (rawRes.data) raw = rawRes.data;
    if (fgRes.data) fg = fgRes.data;
    normalizeSortOrders(raw);
    normalizeSortOrders(fg);
    
    if (logRes.data && logRes.data.length > 0) {
      logs = logRes.data.map(l => ({
        id: l.id,
        tab: l.tab,
        itemId: l.itemid,
        item: l.item,
        action: l.action,
        qty: Number(l.qty || 0),
        unit: l.unit,
        before: Number(l.before || 0),
        after: Number(l.after || 0),
        actionType: l.actiontype,
        user: l.user,
        userId: l.userid || '',
        username: l.username || '',
        timestamp: Number(l.timestamp || 0),
        dateKey: l.datekey || '',
        editedAt: l.editedat || null,
        editedBy: l.editedby || null,
        time: l.time || ''
      })).sort((a,b) => (Number(b.timestamp)||0) - (Number(a.timestamp)||0) || String(b.id).localeCompare(String(a.id)));
      localStorage.setItem('awan_logs_backup', JSON.stringify(logs));
    } else {
      const backup = localStorage.getItem('awan_logs_backup');
      if (backup) logs = JSON.parse(backup);
    }

    if (Array.isArray(configRes.data)) {
      const cfg = Object.fromEntries(configRes.data.map(r => [r.key, r.value]));
      if (cfg.shop_location) shopLocation = cfg.shop_location;
      if (cfg.fabi_reconcile) fabiRecords = cfg.fabi_reconcile || {};
      // inventory_counts chỉ là dữ liệu nhập tạm trong màn hình kiểm kê; không dùng làm nguồn dữ liệu tồn kho.
    }

    try { fabiRecords = JSON.parse(localStorage.getItem('sb_fabi_reconcile') || JSON.stringify(fabiRecords || {})); } catch {}
    // Không khôi phục kiểm kê đã nhập trước đó. Sau khi xác nhận, logs Cloud là nguồn sự thật duy nhất.
    inventoryCounts = {};
    localStorage.removeItem('sb_inventory_counts');

    // Nếu Safari khôi phục phiên của nhân viên, vẫn phải xác nhận vị trí trước khi cho vào hệ thống.
    if (currentUser && String(currentUser.role || '').toLowerCase() === 'staff' && sessionStorage.getItem(SESSION_LOCATION_KEY) !== '1') {
      await verifyStaffLocation(true);
    }

    render();
  } catch (err) {
    console.error("Lỗi nạp dữ liệu Supabase:", err);
    // Không dùng backup Nhật Ký để giả lập dữ liệu Cloud.
    // Nếu Cloud không tải được Ledger, phải báo rõ để tránh hiển thị tồn sai.
    logs = [];
    render();
    if (currentUser) {
      showInventoryNotice(
        '❌ KHÔNG TẢI ĐƯỢC DỮ LIỆU CLOUD',
        `${err?.message || err}

Hệ thống đã dừng việc dùng Nhật Ký cũ trên máy để tránh tính tồn sai. Vui lòng kiểm tra kết nối / quyền Database rồi tải lại.`
      );
    }
  }
}

function roleLabel(role) { return ({ admin: 'Admin Owner', owner: 'Owner', manager: 'Quản Lý', staff: 'Nhân Viên' })[role] || role; }
function dateTime() { return new Date().toLocaleString('vi-VN'); }
function fmt(num) { return Number(num || 0).toLocaleString('vi-VN', { maximumFractionDigits: 3 }); }

function sameLedgerItemId(a, b) {
  const aa = String(a ?? '').trim();
  const bb = String(b ?? '').trim();
  return aa !== '' && bb !== '' && aa === bb;
}

// Một số dữ liệu cũ có thể mang itemId khác kiểu/khác ID sau khi mặt hàng được
// tạo lại. ID vẫn là khóa chính; tên chỉ được dùng làm fallback khi tên là duy nhất.
function logBelongsToItem(log, tab, item) {
  if (!log || log.tab !== tab || !item) return false;
  if (sameLedgerItemId(log.itemId, item.id)) return true;
  const logName = String(log.item || '').trim().toLowerCase();
  const itemName = String(item.name || '').trim().toLowerCase();
  if (!logName || !itemName || logName !== itemName) return false;
  const sameNameItems = (tab === 'raw' ? raw : fg).filter(x => String(x.name || '').trim().toLowerCase() === itemName);
  return sameNameItems.length === 1;
}

function getLedgerLogs(tab, itemId, endTime = Infinity, item = null) {
  return logs
    .filter(l => {
      if (item) return logBelongsToItem(l, tab, item);
      return l.tab === tab && sameLedgerItemId(l.itemId, itemId);
    })
    .map((l, idx) => ({ l, idx }))
    .filter(o => {
      const d = getLogDate(o.l);
      return !d || Number.isNaN(d.getTime()) || d.getTime() <= endTime ? true : false;
    })
    .sort((a,b) => logTimestamp(a.l,a.idx) - logTimestamp(b.l,b.idx));
}

function applyLedgerEvent(tab, stock, log) {
  const type = normalizeActionType(log);
  const q = Number(log.qty || 0);

  if (type === 'stocktake') {
    const target = Number(log.after);
    return Number.isFinite(target) && target >= 0 ? target : stock;
  }

  if (!Number.isFinite(q) || q < 0) return stock;

  if (tab === 'raw') {
    if (type === 'import') return stock + q;
    if (type === 'export') return stock - q;
  } else {
    if (type === 'production') return stock + q;
    if (type === 'sales' || type === 'waste') return stock - q;
    if (type === 'return') return stock + q;
  }
  return stock;
}

function calculateStockFromLogs(tab, item, sourceLogs, endTime = Infinity) {
  const all = (sourceLogs || [])
    .filter(l => logBelongsToItem(l, tab, item))
    .map((l, idx) => ({ l, idx, ts: logTimestamp(l, idx) }))
    .filter(o => {
      const d = getLogDate(o.l);
      return !d || Number.isNaN(d.getTime()) || d.getTime() <= endTime;
    })
    .sort((a,b) => a.ts - b.ts || a.idx - b.idx);

  // Kiểm kê là MỐC GỐC MỚI của tồn kho. Lấy lần kiểm kê gần nhất làm
  // điểm bắt đầu, sau đó chỉ cộng/trừ các giao dịch phát sinh sau mốc đó.
  // Điều này loại bỏ hoàn toàn ảnh hưởng của lịch sử sai trước khi kiểm kê.
  let stock = Number(item?.opening || 0);
  if (!Number.isFinite(stock) || stock < 0) stock = 0;

  let startIndex = 0;
  for (let i = all.length - 1; i >= 0; i--) {
    if (normalizeActionType(all[i].l) !== 'stocktake') continue;
    const target = Number(all[i].l.after);
    if (!Number.isFinite(target) || target < 0) continue;
    stock = target;
    startIndex = i + 1;
    break;
  }

  for (let i = startIndex; i < all.length; i++) {
    const l = all[i].l;
    const type = normalizeActionType(l);
    if (type === 'stocktake') {
      const target = Number(l.after);
      if (Number.isFinite(target) && target >= 0) stock = target;
    } else {
      stock = applyLedgerEvent(tab, stock, l);
    }
  }
  return stock;
}

function calculateStock(tab, item, endTime = Infinity) {
  return calculateStockFromLogs(tab, item, logs, endTime);
}

function getStockRaw(item) {
  return calculateStock('raw', item);
}
function getStockFG(item) {
  return calculateStock('fg', item);
}

function localDateKey(date = new Date()) {
  const d = date instanceof Date ? date : new Date(date);
  const y = d.getFullYear(); const m = String(d.getMonth()+1).padStart(2,'0'); const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function dateRangeForView() {
  if (isDateFilterActive()) return { start: dateFilterStart, end: dateFilterEnd };
  const today = localDateKey();
  return { start: today, end: today };
}

function getDayBoundaryMs(dateKey, end=false) {
  const d = new Date(`${dateKey}T${end ? '23:59:59.999' : '00:00:00.000'}`);
  return d.getTime();
}

function getLogsBeforeDate(tab, item, dateKey) {
  return getLedgerLogs(tab, item.id, getDayBoundaryMs(dateKey, false) - 1);
}

function getDateEndForView(dateKey) {
  // Với hôm nay, chỉ tính đến THỜI ĐIỂM HIỆN TẠI. Không bao giờ coi 23:59:59
  // của hôm nay là dữ liệu đã xảy ra, vì như vậy log tương lai sẽ làm sai tồn.
  return dateKey === localDateKey() ? Date.now() : getDayBoundaryMs(dateKey, true);
}

function getLogsInRange(tab, item, startDate, endDate) {
  const startMs = getDayBoundaryMs(startDate, false);
  const endMs = getDateEndForView(endDate);
  return getLedgerLogs(tab, item.id, endMs, item)
    .filter(({l}) => {
      const t = logTimestamp(l, 0);
      return t >= startMs && t <= endMs;
    });
}

function stockBeforeDate(tab, item, dateKey) {
  // Tồn trước ngày được chọn phải lấy theo Ledger, trong đó Kiểm kê gần nhất
  // luôn là mốc gốc. Không cộng lại lịch sử cũ vào mốc kiểm kê.
  const beforeEnd = getDayBoundaryMs(dateKey, false) - 1;
  return calculateStock(tab, item, beforeEnd);
}

function stockAtDate(tab, item, dateKey) {
  // Hôm nay = đến thời điểm hiện tại; ngày cũ = hết ngày đó.
  return calculateStock(tab, item, getDateEndForView(dateKey));
}

function configSaveLocal(key, value) {
  localStorage.setItem(key, JSON.stringify(value));
}
async function saveConfigCloud(key, value) {
  const { error } = await supabaseClient.from('config').upsert({ key, value });
  if (error) throw error;
}


function saveSession() {
  if (!currentUser) return;
  sessionStorage.setItem(SESSION_USER_KEY, JSON.stringify(currentUser));
  sessionStorage.setItem(SESSION_ACTIVITY_KEY, String(Date.now()));
}

function clearSession() {
  sessionStorage.removeItem(SESSION_USER_KEY);
  sessionStorage.removeItem(SESSION_ACTIVITY_KEY);
  sessionStorage.removeItem(SESSION_LOCATION_KEY);
}

function initSession() {
  const savedUser = sessionStorage.getItem(SESSION_USER_KEY);
  const lastActivity = Number(sessionStorage.getItem(SESSION_ACTIVITY_KEY) || 0);
  if (!savedUser || !lastActivity) return;

  // sessionStorage survives việc chuyển Safari ra nền, nên không bắt đăng nhập lại
  // chỉ vì người dùng chuyển app/tab. Chỉ hết hạn khi thực sự quá 30 phút không thao tác.
  if (Date.now() - lastActivity <= SESSION_TIMEOUT) {
    try {
      currentUser = JSON.parse(savedUser);
    } catch {
      clearSession();
    }
  } else {
    clearSession();
  }
}

function trackActivity() {
  if (!currentUser) return;

  const lastActivity = Number(sessionStorage.getItem(SESSION_ACTIVITY_KEY) || 0);
  if (lastActivity && Date.now() - lastActivity > SESSION_TIMEOUT) {
    logout(true);
    return;
  }
  saveSession();
}

// Không dùng timer/interval để đăng xuất khi Safari đưa trang xuống nền.
// Các sự kiện này chỉ ghi nhận hoạt động thật của người dùng.
document.addEventListener('click', trackActivity);
document.addEventListener('touchstart', trackActivity, { passive: true });
document.addEventListener('keydown', trackActivity);
document.addEventListener('input', trackActivity);

// Khi Safari đưa app ra nền qua thời điểm 00:00, lần quay lại app sẽ hiển thị
// ngay Tồn đầu của ngày mới và các phát sinh trong ngày mới (không mang số ngày cũ sang).
let renderedDayKey = localDateKey();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !currentUser) return;
  const today = localDateKey();
  if (today !== renderedDayKey && !isDateFilterActive()) {
    renderedDayKey = today;
    render();
  }
});

function getShopLocationNormalized() {
  if (!shopLocation) return null;
  let loc = shopLocation;
  if (typeof loc === 'string') {
    try { loc = JSON.parse(loc); } catch { return null; }
  }
  const lat = Number(loc?.lat);
  const lng = Number(loc?.lng);
  const radius = Number(loc?.radius || 100);
  if (!Number.isFinite(lat) || !Number.isFinite(lng)) return null;
  return { lat, lng, radius: Number.isFinite(radius) && radius > 0 ? radius : 100 };
}

function distanceMeters(lat1, lng1, lat2, lng2) {
  const toRad = d => d * Math.PI / 180;
  const R = 6371000;
  const dLat = toRad(lat2 - lat1);
  const dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat/2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng/2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

function verifyStaffLocation(fromSession = false) {
  return new Promise(resolve => {
    if (!currentUser || String(currentUser.role || '').toLowerCase() !== 'staff') return resolve(true);

    const loc = getShopLocationNormalized();
    if (!loc) {
      if (!fromSession) {
        const err = document.getElementById('loginError');
        if (err) { err.textContent = 'Chưa có vị trí quán. Vui lòng báo Admin cài đặt GPS quán trước khi đăng nhập.'; err.style.display = 'block'; }
      } else {
        currentUser = null;
        clearSession();
        alert('Chưa có vị trí GPS quán. Nhân viên chưa thể vào hệ thống. Vui lòng báo Admin cài đặt vị trí quán.');
      }
      return resolve(false);
    }

    if (!navigator.geolocation) {
      if (!fromSession) {
        const err = document.getElementById('loginError');
        if (err) { err.textContent = 'Thiết bị không hỗ trợ định vị GPS. Không thể đăng nhập tài khoản nhân viên.'; err.style.display = 'block'; }
      } else {
        currentUser = null; clearSession();
        alert('Thiết bị không hỗ trợ GPS. Không thể vào hệ thống bằng tài khoản nhân viên.');
      }
      return resolve(false);
    }

    const request = navigator.geolocation.getCurrentPosition(pos => {
      const lat = Number(pos.coords.latitude);
      const lng = Number(pos.coords.longitude);
      const accuracy = Number(pos.coords.accuracy || 0);
      const distance = distanceMeters(lat, lng, loc.lat, loc.lng);
      const allowed = distance <= loc.radius;

      if (!allowed) {
        if (!fromSession) {
          const err = document.getElementById('loginError');
          if (err) {
            err.innerHTML = `📍 Bạn đang cách quán khoảng <b>${Math.round(distance)}m</b>. Phạm vi đăng nhập cho phép là <b>${Math.round(loc.radius)}m</b>.<br>Vui lòng đến quán rồi đăng nhập lại.`;
            err.style.display = 'block';
          }
        } else {
          currentUser = null; clearSession();
          alert(`📍 Không thể khôi phục phiên nhân viên vì vị trí hiện tại cách quán khoảng ${Math.round(distance)}m (cho phép ${Math.round(loc.radius)}m).`);
        }
        return resolve(false);
      }

      sessionStorage.setItem(SESSION_LOCATION_KEY, '1');
      sessionStorage.setItem('awan_staff_location_distance', String(Math.round(distance)));
      sessionStorage.setItem('awan_staff_location_accuracy', String(Math.round(accuracy)));
      resolve(true);
    }, err => {
      let message = 'Không xác định được vị trí hiện tại.';
      if (err?.code === 1) message = 'Bạn chưa cho phép trình duyệt sử dụng vị trí. Hãy bật Quyền vị trí cho Safari rồi đăng nhập lại.';
      if (err?.code === 2) message = 'Không lấy được vị trí hiện tại. Vui lòng bật GPS/Vị trí và thử lại.';
      if (err?.code === 3) message = 'Lấy vị trí quá lâu. Vui lòng thử đăng nhập lại ở nơi có tín hiệu GPS tốt hơn.';
      if (!fromSession) {
        const e = document.getElementById('loginError');
        if (e) { e.textContent = '📍 ' + message; e.style.display = 'block'; }
      } else {
        currentUser = null; clearSession(); alert('📍 ' + message);
      }
      resolve(false);
    }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 30000 });
  });
}

async function login() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const acc = accounts.find(a => a.active && a.username === u && a.password === p);
  const err = document.getElementById('loginError');

  if (!acc) {
    err.textContent = 'Tên đăng nhập hoặc mật khẩu không đúng.';

  }

  err.style.display = 'none';

    if (button) { button.disabled = true; button.textContent = '📍 ĐANG KIỂM TRA VỊ TRÍ...'; }

    if (!ok) { currentUser = null; return; }

  saveSession();
  render();
}

}

function applyDraftToItem(item, tab, type, n) {
  if (tab === 'raw') {
    if (type === 'import') item.imported = (item.imported || 0) + n;
    else item.exported = (item.exported || 0) + n;
  } else {

    if (type === 'return') item.returned = (item.returned || 0) + n;

  }
}

function getLogDateKey(log) {
  const key = String(log?.dateKey || '').trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(key)) return key;
  const ts = Number(log?.timestamp);
  if (Number.isFinite(ts) && ts > 0) return localDateKey(new Date(ts));
  const raw = log?.time || log?.createdAt || log?.created_at || '';
  const d = raw ? new Date(raw) : null;
  return d && !Number.isNaN(d.getTime()) ? localDateKey(d) : '';
}

function getLogDate(log) {
  const ts = Number(log?.timestamp);
  if (Number.isFinite(ts) && ts > 0) return new Date(ts);
  if (log?.dateKey && /^\d{4}-\d{2}-\d{2}$/.test(String(log.dateKey))) {
    const time = String(log.time || '').match(/(\d{1,2}):(\d{2})(?::(\d{2}))?/);
    return new Date(`${log.dateKey}T${String(time?.[1] || '00').padStart(2,'0')}:${time?.[2] || '00'}:${time?.[3] || '00'}`);
  }
  const raw = log?.createdAt || log?.created_at || log?.time;
  if (raw) { const d = new Date(raw); if (!Number.isNaN(d.getTime())) return d; }
  return null;
}

function isDateFilterActive() {
  return !!(dateFilterStart && dateFilterEnd);
}

function getFilteredLogs() {
  if (!isDateFilterActive()) return logs;
  return logs.filter(log => {
    const key = getLogDateKey(log);
    return !!key && key >= dateFilterStart && key <= dateFilterEnd;
  });
}

function getLogsBeforeFilter(logsArray, item, tab) {
  if (!isDateFilterActive()) return [];
  return logsArray.filter(log => {
    if (log.tab !== tab || log.itemId !== item.id) return false;
    const key = getLogDateKey(log);
    return !!key && key < dateFilterStart;
  });
}

function getRangeStats(tab, item, startDate, endDate) {
  const opening = stockBeforeDate(tab, item, startDate);
  const period = getLogsInRange(tab, item, startDate, endDate);
  let stock = opening;

  let imported = 0, exported = 0;
  let sales = 0, production = 0, returned = 0, waste = 0;
  let stocktakeCount = 0, lastStocktake = null;

  for (const {l} of period) {
    const type = normalizeActionType(l);
    const q = Number(l.qty || 0);

    if (tab === 'raw') {
      if (type === 'import') imported += q;
      if (type === 'export') exported += q;
    } else {
      if (type === 'sales') sales += q;
      if (type === 'production') production += q;
      if (type === 'return') returned += q;
      if (type === 'waste') waste += q;
    }

    if (type === 'stocktake') {
      const target = Number(l.after);
      if (Number.isFinite(target) && target >= 0) {
        stock = target;
        stocktakeCount++;
        lastStocktake = target;
      }
    } else {
      stock = applyLedgerEvent(tab, stock, l);
    }
  }

  return tab === 'raw'
    ? { opening, imported, exported, stock, stocktakeCount, lastStocktake }
    : { opening, sales, production, returned, waste, stock, stocktakeCount, lastStocktake };
}

function getCurrentDayRawStats(item) {
  const today = localDateKey();

}

function getCurrentDayFGStats(item) {

function getRawStatsByDate(item) {

}

function getFGStatsByDate(item) {

}

  dateFilterEnd = '';

  render();
}

function toggleDateFilter() {
  if (!dateFilterOpen && !isDateFilterActive()) {
    const today = localDateKey();
    dateFilterStart = today;
    dateFilterEnd = today;
  }
  dateFilterOpen = !dateFilterOpen;
  render();
}

function applyDateFilter() {
  const start = document.getElementById('dateStart')?.value || '';
  const end = document.getElementById('dateEnd')?.value || '';

  if (!start || !end) return showInventoryNotice('📅 Chưa đủ ngày', 'Vui lòng chọn cả Từ ngày và Đến ngày để xem báo cáo.');

}

          <div class="date-report-note">Đây chỉ là chế độ xem báo cáo. Hệ thống lấy các giao dịch trước và trong khoảng ngày đã chọn để cộng/trừ theo đúng Ledger. <b>Không thay đổi tồn kho thực tế và không ghi thêm giao dịch.</b></div>

      <div class="temp-list-box">
        <div style="font-weight:700; font-size:12px; color:var(--text-muted); text-transform:uppercase">

        </div>

function selectDraftAction(type) {
  document.getElementById('draftType').value = type;
  renderDraftModal();
}

function addTempDraft() {
  const type = document.getElementById('draftType').value;
  const qty = Number(document.getElementById('draftAmount').value);
  if (!qty || qty <= 0) return showInventoryNotice('⚠️ Số lượng không hợp lệ', 'Vui lòng nhập số lượng lớn hơn 0.');

  const actionName = actionLabel(draftTab, type);
  tempDraftList.push({ type, qty, actionName });
  document.getElementById('draftAmount').value = '';
  renderDraftModal();
}

function removeTempDraft(index) {
  tempDraftList.splice(index, 1);
  renderDraftModal();
}


function getAvailableStock(tab, item) {
  return calculateStock(tab, item);
}

function validatePositiveQty(qty) {
  return Number.isFinite(Number(qty)) && Number(qty) > 0;
}

function isStockDecreasingAction(tab, type) {
  return tab === 'raw'
    ? type === 'export'
    : ['sales', 'waste'].includes(type);
}

function validateTransaction(tab, item, type, qty) {
  const n = Number(qty);
  if (!validatePositiveQty(n)) return 'Số lượng phải lớn hơn 0.';

  if (isStockDecreasingAction(tab, type)) {
    const available = getAvailableStock(tab, item);
    if (n > available) {
      return `Không đủ tồn kho để ${actionLabel(tab, type)}. Tồn hiện có: ${fmt(available)} ${item.unit}.`;
    }
  }
  return null;
}

async function confirmAllDrafts() {
  // Khóa ngay lập tức để click/touch liên tiếp không thể chạy song song.
  if (transactionSaving) return;
  transactionSaving = true;

  const saveButtons = Array.from(document.querySelectorAll('button')).filter(
    b => /confirmAllDrafts\(\)/.test(b.getAttribute('onclick') || '')
  );
  saveButtons.forEach(b => {
    b.disabled = true;
    b.dataset.originalText = b.textContent;
    b.textContent = '⏳ Đang lưu...';
    b.style.pointerEvents = 'none';
  });

  const resetSaving = () => {
    transactionSaving = false;
    saveButtons.forEach(b => {
      b.disabled = false;
      b.style.pointerEvents = '';
      if (b.dataset.originalText) b.textContent = b.dataset.originalText;
      delete b.dataset.originalText;
    });
  };

  try {
    const itemFromUi = (draftTab === 'raw' ? raw : fg)[draftItem];
    const inputEl = document.getElementById('draftAmount');
    const inputQty = Number(inputEl?.value || 0);
    const inputType = document.getElementById('draftType')?.value;

    if (!itemFromUi) {
      return showInventoryNotice('⚠️ Không tìm thấy mặt hàng', 'Vui lòng đóng cửa sổ và thao tác lại.');
    }

    // Số lượng đang nằm trong ô nhập luôn được đưa vào giao dịch,
    // kể cả khi trước đó đã có một hoặc nhiều thao tác Lưu tạm.
    const drafts = tempDraftList.map(x => ({ ...x, qty: Number(x.qty) }));
    if (inputQty > 0) {
      if (!inputType) {
        return showInventoryNotice('⚠️ Chưa chọn thao tác', 'Vui lòng chọn loại thao tác trước khi xác nhận.');
      }
      drafts.push({
        type: inputType,
        qty: inputQty,
        actionName: actionLabel(draftTab, inputType)
      });
    }

    if (!drafts.length) {
      return showInventoryNotice('⚠️ Chưa có giao dịch', 'Vui lòng nhập số lượng hoặc bấm “Lưu tạm” ít nhất 1 thao tác.');
    }

    // Đọc lại đúng mặt hàng từ Cloud ngay trước khi kiểm tra tồn.
    // Không dùng object cũ đang nằm trên màn hình để quyết định giao dịch.
    const itemTable = draftTab === 'raw' ? 'raw_items' : 'fg_items';
    const { data: freshItem, error: freshError } = await supabaseClient
      .from(itemTable)
      .select('*')
      .eq('id', itemFromUi.id)
      .maybeSingle();

    if (freshError) {
      return showInventoryNotice(
        '❌ Không thể kiểm tra tồn mới nhất',
        `${freshError.message || freshError}\n\nDữ liệu chưa được lưu.`
      );
    }
    if (!freshItem) {
      return showInventoryNotice(
        '❌ Không tìm thấy dữ liệu Cloud',
        'Mặt hàng không còn tồn tại trên Cloud. Dữ liệu chưa được lưu.'
      );
    }

    const { data: freshLogRows, error: freshLogsError } = await supabaseClient
      .from('logs')
      .select('*')
      .eq('itemid', itemFromUi.id);

    if (freshLogsError) {
      return showInventoryNotice('❌ Không thể kiểm tra Ledger mới nhất',
        `${freshLogsError.message || freshLogsError}\n\nDữ liệu chưa được lưu.`);
    }

    const freshLogs = (freshLogRows || []).map(l => ({
      id: l.id, tab: l.tab, itemId: l.itemid, item: l.item, action: l.action,
      qty: Number(l.qty || 0), unit: l.unit, before: Number(l.before || 0),
      after: Number(l.after || 0), actionType: l.actiontype, user: l.user,
      username: l.userid || '', timestamp: Number(l.timestamp || 0),
      dateKey: l.datekey || '', editedAt: l.editedat || null,
      editedBy: l.editedby || null, time: l.time || ''
    }));

    // Tất cả validation + before/after chạy trên Ledger Cloud mới nhất.
    const trial = JSON.parse(JSON.stringify(freshItem));
    const prepared = [];
    let trialStock = calculateStockFromLogs(draftTab, freshItem, freshLogs);

    if (trialStock < -1e-9) {
      return showInventoryNotice('⚠️ TỒN KHO ĐANG ÂM',
        `${freshItem.name} đang có tồn Ledger ${fmt(trialStock)} ${freshItem.unit}.\n\nHệ thống không cho phép tiếp tục xuất/bán. Hãy kiểm tra nhật ký hoặc thực hiện kiểm kê.`);
    }
    for (const draft of drafts) {
      const qty = Number(draft.qty);
      if (!validatePositiveQty(qty)) {
        return showInventoryNotice('⚠️ KHÔNG THỂ GHI NHẬN',
          'Số lượng phải lớn hơn 0.\n\nDữ liệu chưa được lưu.');
      }

      const before = trialStock;
      const decreasing = isStockDecreasingAction(draftTab, draft.type);
      if (decreasing && qty > before + 1e-9) {
        const verb = draftTab === 'raw'
          ? 'xuất kho'
          : (draft.type === 'sales' ? 'xuất bán' : 'hủy món');
        return showInventoryNotice(
          '⚠️ KHÔNG ĐỦ TỒN KHO',
          `Bạn nhập ${fmt(qty)} ${freshItem.unit} để ${verb}, nhưng tồn khả dụng chỉ ${fmt(Math.max(0,before))} ${freshItem.unit}.\n\nSố lượng này sẽ làm tồn âm nên hệ thống đã chặn.\nDữ liệu chưa được lưu.`
        );
      }

      let after = before;
      if (draftTab === 'raw') {
        if (draft.type === 'import') after += qty;
        else if (draft.type === 'export') after -= qty;
        else return showInventoryNotice('⚠️ THAO TÁC KHÔNG HỢP LỆ', 'Kho Thô chỉ cho phép Nhập kho hoặc Xuất kho.');
      } else {
        if (draft.type === 'production' || draft.type === 'return') after += qty;
        else if (draft.type === 'sales' || draft.type === 'waste') after -= qty;
        else return showInventoryNotice('⚠️ THAO TÁC KHÔNG HỢP LỆ', 'Thành phẩm chỉ cho phép Xuất bán, Nấu thêm, Thu hồi hoặc Hủy món.');
      }

      if (after < -1e-9) {
        return showInventoryNotice(
          '⚠️ GIAO DỊCH BỊ CHẶN',
          `${actionLabel(draftTab, draft.type)} ${fmt(qty)} ${freshItem.unit} làm tồn kho âm.\nTồn sau dự kiến: ${fmt(after)} ${freshItem.unit}.\n\nKhông có dữ liệu nào được ghi.`
        );
      }

      applyDraftToItem(trial, draftTab, draft.type, qty);
      trialStock = after;
      prepared.push({ draft, qty, before, after });
    }

    const savedTab = draftTab;
    const savedItemId = freshItem.id;
    const originalItem = JSON.parse(JSON.stringify(freshItem));
    const updatedItem = JSON.parse(JSON.stringify(trial));
    const logsToInsert = [];
    const payloadSupabaseList = [];
    const now = Date.now();
    const userName = `${currentUser.name} (${roleLabel(currentUser.role)})`;

    for (let i = 0; i < prepared.length; i++) {
      const p = prepared[i];
      const logId = 'log_' + now + '_' + Math.random().toString(36).slice(2, 9) + '_' + i;
      const timestamp = now + i;
      const timeNow = dateTime();

      logsToInsert.push({
        id: logId,
        tab: savedTab,
        itemId: savedItemId,
        item: freshItem.name,
        action: p.draft.actionName,
        qty: p.qty,
        unit: freshItem.unit,
        before: p.before,
        after: p.after,
        actionType: p.draft.type,
        user: userName,
        userId: currentUser.id,
        username: currentUser.username,
        timestamp,
        time: timeNow
      });

      payloadSupabaseList.push({
        id: logId,
        tab: savedTab,
        itemid: savedItemId,
        item: freshItem.name,
        action: p.draft.actionName,
        qty: p.qty,
        unit: freshItem.unit,
        before: p.before,
        after: p.after,
        actiontype: p.draft.type,
        timestamp,
        datekey: localDateKey(),
        userid: currentUser.id || currentUser.username || '',
        user: userName,
        time: timeNow,
        editedat: null,
        editedby: null
      });
    }

    try {
      // 1) Ghi Log trước. Nếu lỗi thì item Cloud chưa bị thay đổi.
      const { error: logError } = await supabaseClient
        .from('logs')
        .insert(payloadSupabaseList);
      if (logError) {
        throw new Error(`Không thể ghi Nhật Ký Cloud: ${logError.message || logError}`);
      }

      // 2) Log Cloud là nguồn sự thật của tồn kho.
      // Các cột tổng trên raw_items/fg_items chỉ là dữ liệu phụ. Nếu update
      // các cột tổng bị RLS/permission chặn thì KHÔNG được làm mất Log vừa ghi,
      // vì nếu rollback Log ở đây sẽ tái diễn lỗi 'giao dịch không vào Database'.
      const { error: itemError } = await supabaseClient
        .from(itemTable)
        .update(updatedItem)
        .eq('id', originalItem.id);
      if (itemError) {
        console.warn('Không cập nhật được cột tổng hàng hóa; Ledger vẫn dùng Log Cloud:', itemError.message || itemError);
      }

      // Chỉ sau khi Log Cloud thành công mới cập nhật state trên màn hình.
      const localItem = (savedTab === 'raw' ? raw : fg).find(x => x.id === savedItemId);
      if (localItem) Object.assign(localItem, updatedItem);

      logs = [...logsToInsert, ...logs];
      sortLogsNewestFirst();
      localStorage.setItem('awan_logs_backup', JSON.stringify(logs));
      localStorage.setItem(
        savedTab === 'raw' ? 'awan_raw_backup' : 'awan_fg_backup',
        JSON.stringify(savedTab === 'raw' ? raw : fg)
      );

      tempDraftList = [];
      closeModal();
      render();
      showSuccessToast(`${prepared.length} giao dịch đã được ghi nhận`);
    } catch (err) {
      Object.assign(freshItem, originalItem);
      console.error('Lỗi khi ghi giao dịch:', err);
      showInventoryNotice(
        '❌ GIAO DỊCH KHÔNG ĐƯỢC GHI NHẬN',
        `${err.message || err}\n\nTồn kho và Nhật Ký trên màn hình chưa được cập nhật.`
      );
    }
  } catch (err) {
    console.error('Lỗi xử lý giao dịch:', err);
    showInventoryNotice(
      '❌ GIAO DỊCH KHÔNG ĐƯỢC GHI NHẬN',
      `${err.message || err}\n\nDữ liệu chưa được lưu.`
    );
  } finally {
    resetSaving();
  }
}

async function saveManualLocation() {
  const lat = Number(document.getElementById('shopLat').value);
  const lng = Number(document.getElementById('shopLng').value);
  if (!lat || !lng) return alert('Vui lòng nhập đúng số tọa độ GPS.');

  shopLocation = { lat, lng, radius: 100 };
  await supabaseClient.from('config').upsert({ key: 'shop_location', value: shopLocation });
  closeModal();
  alert('Đã cập nhật tọa độ GPS quán thành công!');
}

async function addAccount() {
  const name = document.getElementById('accName').value.trim();
  const username = document.getElementById('accUser').value.trim();
  const password = document.getElementById('accPass').value;
  const role = document.getElementById('accRole').value;
  const shift = document.getElementById('accShift').value;

  if (!name || !username || !password) return alert('Vui lòng nhập đầy đủ thông tin.');
  if (accounts.some(a => a.username.toLowerCase() === username.toLowerCase())) return alert('Tên đăng nhập này đã được dùng.');

  const newAcc = { id: 'a_' + Date.now(), name, username, password, role, shift, active: true };
  accounts.push(newAcc);
  await supabaseClient.from('accounts').insert([newAcc]);
  openAdmin('accounts');
}

async function removeAccount(id) {
  if (id === currentUser.id) return alert('Không thể xóa tài khoản của chính bạn.');
  if (!confirm('Bạn có chắc muốn xóa tài khoản này?')) return;
  accounts = accounts.filter(a => a.id !== id);
  await supabaseClient.from('accounts').delete().eq('id', id);
  openAdmin('accounts');
}

async function saveItem() {
  const type = document.getElementById('itemType').value;
  const name = document.getElementById('itemName').value.trim();
  const unit = document.getElementById('itemUnit').value.trim();
  const opening = Number(document.getElementById('itemOpening')?.value || 0);

  if (!name || !unit) return alert('Vui lòng nhập Tên mặt hàng và Đơn vị tính.');
  const arr = type === 'raw' ? raw : fg;

  if (editingItemId) {
    const item = arr.find(x => x.id === editingItemId);
    if (item) {
      item.name = name;
      item.unit = unit;
      item.opening = opening;
      if (type === 'raw') {
        item.group = document.getElementById('itemGroup').value;
      } else {
        item.category = document.getElementById('itemCat').value;
      }
      await syncItemToSupabase(type, item);
    }
    editingItemId = null;
  } else {
    if (arr.some(x => x.name.trim().toLowerCase() === name.toLowerCase())) {
      return alert('Mặt hàng này đã có trong danh mục.');
    }

    let newItem;
    if (type === 'raw') {
      const group = document.getElementById('itemGroup').value;
      newItem = { id: 'r_' + Date.now(), name, unit, group, opening, imported: 0, exported: 0, sort_order: (raw.reduce((m,x)=>Math.max(m, Number(x.sort_order)||0),0) || raw.length*10) + 10 };
      raw.push(newItem);
    } else {
      const category = document.getElementById('itemCat').value;
      newItem = { id: 'f_' + Date.now(), name, unit, category, opening, sales: 0, production: 0, returned: 0, waste: 0, sort_order: (fg.reduce((m,x)=>Math.max(m, Number(x.sort_order)||0),0) || fg.length*10) + 10 };
      fg.push(newItem);
    }
    await syncItemToSupabase(type, newItem);
  }

  openAdmin('items');
}

async function deleteItem(type, id) {
  const arr = type === 'raw' ? raw : fg;
  const x = arr.find(z => z.id === id);
  if (!x) return;
  if (!confirm(`Xóa hẳn mặt hàng “${x.name}” khỏi danh mục?`)) return;

  if (type === 'raw') raw = raw.filter(z => z.id !== id);
  else fg = fg.filter(z => z.id !== id);

  const table = type === 'raw' ? 'raw_items' : 'fg_items';
  await supabaseClient.from(table).delete().eq('id', id);
  openAdmin('items');
}


// ===== LEDGER: nguồn sự thật cho tồn kho khi SỬA/XÓA nhật ký =====
function isOwnerRole() {
  return ['admin', 'owner'].includes(String(currentUser?.role || '').toLowerCase());
}
function canDeleteAnyLog() {
  return isOwnerRole();
}
function logTimestamp(log, fallbackIndex = 0) {
  // Log thực tế có timestamp dạng Unix milliseconds; phải ưu tiên trường này.
  const timestamp = Number(log?.timestamp);
  if (Number.isFinite(timestamp) && timestamp > 0) return timestamp;

  const raw = log?.createdAt || log?.created_at || log?.time;
  const t = raw ? Date.parse(raw) : NaN;
  return Number.isFinite(t) ? t : fallbackIndex;
}
function normalizeActionType(log) {
  if (log.actionType) return log.actionType;
  const a = String(log.action || '');
  if (a === 'Nhập' || a === 'Nhập kho') return 'import';
  if (a === 'Xuất' || a === 'Xuất kho') return 'export';
  if (a === 'Xuất bán') return 'sales';
  if (a === 'Nấu thêm') return 'production';
  if (a === 'Thu hồi' || a === 'Thu hồi cuối ngày') return 'return';
  if (a === 'Hủy món') return 'waste';
  // Dữ liệu điều chỉnh cũ được coi là sự kiện kiểm kê để không làm mất lịch sử.
  // Tương thích dữ liệu cũ: các bản ghi "Điều chỉnh" cũ được đọc như một
  // mốc Kiểm kê; từ phiên bản này không tạo thêm loại giao dịch Điều chỉnh.
  if (a === 'Điều chỉnh tăng' || a === 'Điều chỉnh giảm' || log.actionType === 'adjustment') return 'stocktake';
  if (a === 'Kiểm kê' || log.actionType === 'stocktake') return 'stocktake';
  if (a === 'Sửa dữ liệu lỗi cũ') return 'data_repair';
  return null;
}
function applyLedgerMovement(tab, state, type, qty) {
  const n = Number(qty);
  if (!Number.isFinite(n) || n <= 0) return false;
  if (tab === 'raw') {
    if (type === 'import') state.imported += n;
    else if (type === 'export') state.exported += n;
    else return false;
  } else {
    if (type === 'sales') state.sales += n;
    else if (type === 'production') state.production += n;
    else if (type === 'return') state.returned += n;
    else if (type === 'waste') state.waste += n;
    else return false;
  }
  return true;
}

function ledgerStock(tab, state) {
  return tab === 'raw'
    ? Number(state.opening || 0) + Number(state.imported || 0) - Number(state.exported || 0)
    : Number(state.opening || 0) + Number(state.production || 0) - Number(state.sales || 0) + Number(state.returned || 0) - Number(state.waste || 0);
}

function simulateItemLedger(tab, item, overrideLogId = null, overrideQty = null, deletedLogId = null) {
  const itemLogs = logs
    .map((l, idx) => ({ l, idx }))
    .filter(o => logBelongsToItem(o.l, tab, item) && o.l.id !== deletedLogId)
    .sort((a,b) => logTimestamp(a.l,a.idx) - logTimestamp(b.l,b.idx));

  const state = {
    opening: Math.max(0, Number(item.opening || 0)),
    imported: 0, exported: 0,
    production: 0, sales: 0, returned: 0, waste: 0
  };
  const results = [];
  let stock = ledgerStock(tab, state);

  if (stock < -1e-9) {
    return { ok:false, message:`Tồn đầu của ${item.name} đang âm. Vui lòng kiểm tra lại dữ liệu gốc.` };
  }

  for (const o of itemLogs) {
    const l = o.l;
    const type = normalizeActionType(l);
    const qty = l.id === overrideLogId ? Number(overrideQty) : Number(l.qty);

    if (type === 'data_repair') continue;
    if (!type || !Number.isFinite(qty) || qty <= 0) {
      if (type === 'stocktake') {
        const target = Number(l.after);
        if (Number.isFinite(target) && target >= 0) {
          const before = stock;
          stock = target;
          results.push({ id:l.id, before, after:stock });
          continue;
        }
      }
      return { ok:false, message:`Nhật ký "${l.action}" của ${item.name} có số lượng không hợp lệ.` };
    }

    const before = stock;

    if (type === 'stocktake') {
      const target = Number(l.after);
      if (!Number.isFinite(target) || target < 0) {
        return { ok:false, message:`Nhật ký kiểm kê của ${item.name} có Tồn thực tế không hợp lệ.` };
      }
      stock = target;
    } else {
      const decreasing = tab === 'raw' ? type === 'export' : ['sales','waste'].includes(type);
      if (decreasing && qty > before + 1e-9) {
        return {
          ok:false,
          message:`Không thể ghi vì "${l.action}" ${fmt(qty)} ${item.unit} làm tồn kho âm. Tồn khả dụng tại thời điểm đó chỉ ${fmt(Math.max(0,before))} ${item.unit}.`
        };
      }
      if (!applyLedgerMovement(tab, state, type, qty)) {
        return { ok:false, message:`Không xác định được loại giao dịch của nhật ký "${l.action}".` };
      }
      stock = ledgerStock(tab, state);
    }

    if (stock < -1e-9) {
      return { ok:false, message:`Giao dịch "${l.action}" làm tồn kho âm ${fmt(stock)} ${item.unit}.` };
    }
    results.push({ id:l.id, before, after:stock });
  }

  return { ok:true, state, results, stock };
}

function rebuildItemLedger(tab, item) {
  const sim = simulateItemLedger(tab, item);
  if (!sim.ok) return sim;

  item.imported = sim.state.imported;
  item.exported = sim.state.exported;
  item.production = sim.state.production;
  item.sales = sim.state.sales;
  item.returned = sim.state.returned;
  item.waste = sim.state.waste;

  const byId = new Map(sim.results.map(r => [r.id, r]));
  logs.forEach(l => {
    if (l.tab === tab && l.itemId === item.id && byId.has(l.id)) {
      const r = byId.get(l.id);
      l.before = r.before;
      l.after = r.after;
      l.actionType = normalizeActionType(l);
    }
  });
  return sim;
}
function saveLocalState() {
  localStorage.setItem('awan_logs_backup', JSON.stringify(logs));
  localStorage.setItem('awan_raw_backup', JSON.stringify(raw));
  localStorage.setItem('awan_fg_backup', JSON.stringify(fg));
}

// SỬA / XÓA NHẬT KÝ THEO PHÂN QUYỀN
function canEditLog(l) {
  if (!currentUser) return false;
  const role = String(currentUser.role || '').toLowerCase();
  if (['admin','owner','manager'].includes(role)) return true;

  // Nhân viên chỉ được sửa nhật ký do chính tài khoản đó tạo.
  const logUserId = String(l.userId || '').trim();
  const logUsername = String(l.username || '').trim();
  const currentId = String(currentUser.id || '').trim();
  const currentUsername = String(currentUser.username || '').trim();
  if (logUserId && currentId) return logUserId === currentId;
  if (logUsername && currentUsername) return logUsername === currentUsername;
  return false;
}

function editLog(id) {
  if (isDateFilterActive()) {
    showInventoryNotice('📅 Đang xem báo cáo', 'Bạn đang ở chế độ xem lại theo ngày. Hãy bấm “Về hiện tại” trước khi sửa nhật ký.');
    return;
  }
  const l = logs.find(x => x.id === id);
  if (!l) return;
  if (!canEditLog(l)) return alert('Bạn không có quyền sửa nhật ký do người khác tạo.');
  if (normalizeActionType(l) === 'stocktake') return alert('Nhật ký kiểm kê không sửa trực tiếp. Nếu nhập sai, Owner/Admin có thể xóa nhật ký kiểm kê và thực hiện kiểm kê lại.');

  editLogId = id;
  openModal(`
    <h2 style="font-size:18px">✏ Sửa nhật ký giao dịch</h2>
    <div class="notice-box" style="margin-top:10px">${l.action} - <b>${l.item}</b><br>Tạo bởi: <b>${l.user}</b><br>Số lượng hiện tại: <b style="font-size:16px">${fmt(l.qty)} ${l.unit}</b></div>
    <div class="form-group"><label>Số lượng mới</label><input id="editAmount" type="number" min="0.001" step="any" value="${l.qty}"></div>
    <div class="modal-buttons"><button class="btn-cancel" onclick="closeModal()">Hủy</button><button class="btn-save" onclick="saveLogEdit()">Lưu thay đổi</button></div>
  `);
}

async function saveLogEdit() {
  const l = logs.find(x => x.id === editLogId);
  const n = Number(document.getElementById('editAmount')?.value);
  if (!l || !(n > 0)) return showInventoryNotice('⚠️ Số lượng không hợp lệ', 'Số lượng mới phải lớn hơn 0. Dữ liệu chưa được lưu.');
  if (!canEditLog(l)) return showInventoryNotice('⚠️ Không có quyền', 'Bạn không có quyền sửa nhật ký này.');
  if (normalizeActionType(l) === 'stocktake') {
    return showInventoryNotice('🧾 Nhật ký kiểm kê', 'Nhật ký kiểm kê không sửa trực tiếp. Nếu nhập sai, Owner/Admin có thể xóa nhật ký và thực hiện kiểm kê lại.');
  }

  const arr = l.tab === 'raw' ? raw : fg;
  const x = arr.find(z => z.id === l.itemId);
  if (!x) return showInventoryNotice('❌ Không tìm thấy mặt hàng', 'Mặt hàng không còn trong danh mục.');

  const oldQty = Number(l.qty || 0);
  const oldAfter = l.after;
  const oldEditedAt = l.editedAt;
  const oldEditedBy = l.editedBy;
  const oldEditDetail = l.editDetail || '';
  const originalItem = JSON.parse(JSON.stringify(x));

  // Dựng lại toàn bộ Ledger với số lượng mới. Nếu bất kỳ thời điểm nào
  // bị âm, chặn ngay trước khi ghi Cloud.
  const sim = simulateItemLedger(l.tab, x, l.id, n);
  if (!sim.ok) {
    return showInventoryNotice(
      '⚠️ KHÔNG THỂ SỬA NHẬT KÝ',
      `${sim.message}\n\nDữ liệu chưa được lưu.`
    );
  }

  const resultMap = new Map(sim.results.map(r => [r.id, r]));
  const newAfter = resultMap.get(l.id)?.after ?? l.after;
  const editedAt = dateTime();
  const editedBy = currentUser.name;
  const editDetail = `Số lượng: ${fmt(oldQty)} ${l.unit} → ${fmt(n)} ${l.unit}`;

  const updatedItem = JSON.parse(JSON.stringify(x));
  updatedItem.imported = sim.state.imported;
  updatedItem.exported = sim.state.exported;
  updatedItem.production = sim.state.production;
  updatedItem.sales = sim.state.sales;
  updatedItem.returned = sim.state.returned;
  updatedItem.waste = sim.state.waste;

  const confirmed = await showInventoryConfirm(
    '⚠️ XÁC NHẬN SỬA NHẬT KÝ',
    `Bạn có chắc chắn muốn sửa nhật ký “${l.action}” của ${l.item}?\n\nSố lượng: ${fmt(oldQty)} ${l.unit} → ${fmt(n)} ${l.unit}\nTồn sau giao dịch: ${fmt(newAfter)} ${l.unit}\n\nHệ thống sẽ kiểm tra lại toàn bộ Ledger của mặt hàng trước khi lưu.`
  );
  if (!confirmed) return;

  try {
    const table = l.tab === 'raw' ? 'raw_items' : 'fg_items';

    const { error: itemError } = await supabaseClient.from(table).upsert(updatedItem);
    if (itemError) throw new Error(`Không thể cập nhật tồn kho Cloud: ${itemError.message || itemError}`);

    const { error: logError } = await supabaseClient.from('logs').update({
      qty: n,
      before: Number(resultMap.get(l.id)?.before ?? l.before ?? 0),
      after: Number(newAfter),
      actiontype: normalizeActionType(l),
      editedat: editedAt,
      editedby: editedBy,
    }).eq('id', l.id);
    if (logError) {
      await supabaseClient.from(table).upsert(originalItem);
      throw new Error(`Không thể cập nhật Nhật Ký Cloud: ${logError.message || logError}`);
    }

    Object.assign(x, updatedItem);
    l.qty = n;
    l.before = Number(resultMap.get(l.id)?.before ?? l.before ?? 0);
    l.after = Number(newAfter);
    l.actionType = normalizeActionType(l);
    l.editedAt = editedAt;
    l.editedBy = editedBy;
    l.editDetail = editDetail;

    // Cập nhật lại before/after trên các Log phía sau trong bộ nhớ để
    // Ledger hiển thị nhất quán ngay lập tức.
    logs.forEach(log => {
      if (log.tab === l.tab && log.itemId === l.itemId && resultMap.has(log.id)) {
        const r = resultMap.get(log.id);
        log.before = r.before;
        log.after = r.after;
      }
    });

    saveLocalState();
    closeModal();
    render();
    showSuccessToast('Đã sửa nhật ký và kiểm tra lại toàn bộ Ledger');
  } catch (err) {
    Object.assign(x, originalItem);
    l.qty = oldQty;
    l.after = oldAfter;
    l.editedAt = oldEditedAt;
    l.editedBy = oldEditedBy;
    l.editDetail = oldEditDetail;
    return showInventoryNotice(
      '❌ SỬA NHẬT KÝ KHÔNG THÀNH CÔNG',
      `${err.message || err}\n\nDữ liệu trên màn hình đã được giữ nguyên.`
    );
  }
}

async function deleteLog(id) {
  if (isDateFilterActive()) {
    showInventoryNotice('📅 Đang xem báo cáo', 'Bạn đang ở chế độ xem lại theo ngày. Hãy bấm “Về hiện tại” trước khi xóa nhật ký.');
    return;
  }
  if (!['admin','owner'].includes(String(currentUser?.role || '').toLowerCase())) {
    return alert('Chỉ tài khoản Admin/Owner mới có quyền xóa nhật ký.');
  }

  const l = logs.find(x => x.id === id);
  if (!l) return alert('Không tìm thấy nhật ký.');

  const arr = l.tab === 'raw' ? raw : fg;
  const x = arr.find(z => z.id === l.itemId);
  if (!x) return alert(`Không tìm thấy mặt hàng “${l.item}” trong hệ thống.`);

  const type = normalizeActionType(l);
  const qty = Number(l.qty || 0);
  if (!type || !(qty > 0)) return alert('Nhật ký này thiếu loại giao dịch hoặc số lượng không hợp lệ.');
  const confirmed = await showInventoryConfirm(
    '⚠️ XÁC NHẬN XÓA NHẬT KÝ',
    `Bạn có chắc muốn xóa nhật ký “${l.action} ${fmt(qty)} ${l.unit}” của ${l.item}?\n\nHệ thống sẽ xóa record Cloud và hoàn tác tồn kho.`
  );
  if (!confirmed) return;

  const oldItem = JSON.parse(JSON.stringify(x));
  const oldLogs = logs.slice();

  // Xóa kiểm kê không thay đổi các cột tổng giao dịch trên item.
  // Tồn sau xóa sẽ được dựng lại từ Ledger.
  if (type === 'stocktake') {
    // Không thay đổi x.
  } else {
    if (l.tab === 'raw') {
      if (type === 'import') x.imported = Number(x.imported || 0) - qty;
      else if (type === 'export') x.exported = Number(x.exported || 0) - qty;
      else return alert('Loại giao dịch kho thô không hợp lệ.');
    } else {
      if (type === 'sales') x.sales = Number(x.sales || 0) - qty;
      else if (type === 'production') x.production = Number(x.production || 0) - qty;
      else if (type === 'return') x.returned = Number(x.returned || 0) - qty;
      else if (type === 'waste') x.waste = Number(x.waste || 0) - qty;
      else return alert('Loại giao dịch thành phẩm không hợp lệ.');
    }
  }

  const table = l.tab === 'raw' ? 'raw_items' : 'fg_items';

  // QUAN TRỌNG: Supabase không throw khi delete lỗi, phải đọc error trực tiếp.
  const { error: logError } = await supabaseClient.from('logs').delete().eq('id', id);
  if (logError) {
    Object.assign(x, oldItem);
    return alert(`Không thể xóa nhật ký trên Cloud.\n\n${logError.message || 'Lỗi Supabase'}`);
  }

  // Sau khi log xóa thành công mới ghi lại các cột tổng giao dịch trên item. Nhật ký kiểm kê không thay đổi các cột tổng.
  const { error: itemError } = await supabaseClient.from(table).upsert(x);
  if (itemError) {
    // Khôi phục log Cloud nếu cập nhật tồn kho thất bại.
    const { error: restoreError } = await supabaseClient.from('logs').insert({
      id: l.id,
      tab: l.tab,
      itemid: l.itemId,
      item: l.item,
      action: l.action,
      qty: qty,
      unit: l.unit,
      before: Number(l.before || 0),
      after: Number(l.after || 0),
      actiontype: type,
      timestamp: Number(l.timestamp || Date.now()),
      datekey: l.dateKey || new Date().toLocaleDateString('en-CA'),
      userid: l.userId || l.username || currentUser.id || '',
      user: l.user || '',
      time: l.time || '',
      editedat: l.editedAt || null,
      editedby: l.editedBy || null,
    });
    Object.assign(x, oldItem);
    const restoreText = restoreError ? `\nKhôi phục nhật ký cũng lỗi: ${restoreError.message}` : '';
    return alert(`Không thể cập nhật tồn kho Cloud sau khi xóa. ${itemError.message || 'Lỗi Supabase'}${restoreText}`);
  }

  logs = oldLogs.filter(z => z.id !== id);
  sortLogsNewestFirst();
  localStorage.setItem('awan_logs_backup', JSON.stringify(logs));
  render();
}

function showSuccessToast(message){

function showInventoryConfirm(title, message){
  return new Promise(resolve=>{
    const old=document.getElementById('inventoryConfirmOverlay');
    if(old) old.remove();
    const overlay=document.createElement('div');
    overlay.id='inventoryConfirmOverlay';
    overlay.className='inventory-confirm-overlay';
    overlay.innerHTML=`<div class="inventory-confirm-box" role="dialog" aria-modal="true"><div class="inventory-confirm-head">${title}</div><div class="inventory-confirm-body">${String(message).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div><div class="inventory-confirm-actions"><button type="button" class="inventory-confirm-cancel">Hủy</button><button type="button" class="inventory-confirm-ok">Xác nhận</button></div></div>`;
    document.body.appendChild(overlay);
    const finish=v=>{overlay.remove(); resolve(v)};
    overlay.querySelector('.inventory-confirm-cancel').addEventListener('click',()=>finish(false));
    overlay.querySelector('.inventory-confirm-ok').addEventListener('click',()=>finish(true));
    overlay.addEventListener('click',e=>{if(e.target===overlay) finish(false)});
  });
}

}
async function applyInventoryStocktake() {
  if (inventorySaving) return;
  if (!currentUser) return showInventoryNotice('⚠️ Phiên đăng nhập', 'Phiên đăng nhập không hợp lệ. Vui lòng đăng nhập lại.');
  if (!isOwnerRole()) return showInventoryNotice('⚠️ Không có quyền', 'Chỉ tài khoản Admin/Owner mới được thực hiện kiểm kê.');

  inventorySaving = true;
  const date = document.getElementById('countDate')?.value || localDateKey();
  const saved = { ...(inventoryCounts[date] || {}) };

  [...raw.map(x=>['raw',x]), ...fg.map(x=>['fg',x])].forEach(([tab,x]) => {
    const el = document.getElementById('count_'+tab+'_'+x.id);
    if (!el || el.value === '') return;
    const n = Number(el.value);
    if (Number.isFinite(n) && n >= 0) saved[tab+'|'+x.id] = n;
  });

  const changes = [];
  [...raw.map(x=>['raw',x]), ...fg.map(x=>['fg',x])].forEach(([tab,x]) => {
    const key = tab+'|'+x.id;
    if (saved[key] == null) return;
    const system = stockAtDate(tab, x, date);
    const actual = Number(saved[key]);
    if (!Number.isFinite(actual) || actual < 0) return;
    if (Math.abs(actual - system) <= 1e-9) return;
    changes.push({tab, x, system, actual});
  });

  if (!changes.length) {
    inventorySaving = false;
    return showInventoryNotice('ℹ️ Chưa có chênh lệch', `Ngày kiểm kê: ${date}\n\nKhông có mặt hàng nào có chênh lệch so với tồn hệ thống.`);
  }

  const preview = changes.slice(0, 8)
    .map(c => `• ${c.x.name}: ${fmt(c.system)} → ${fmt(c.actual)} ${c.x.unit}`)
    .join('\n');
  const more = changes.length > 8 ? `\n• ... và ${changes.length - 8} mặt hàng khác` : '';

  const confirmed = await showInventoryConfirm(
    '🧾 XÁC NHẬN KIỂM KÊ',
    `Ngày kiểm kê: ${date}\nCó ${changes.length} mặt hàng có chênh lệch.\n\n${preview}${more}\n\nKiểm kê là ngoại lệ duy nhất được phép thay đổi Tồn hệ thống theo Tồn thực tế.\nHệ thống sẽ ghi Nhật Ký “Kiểm kê”.\n\nBạn có chắc chắn muốn xác nhận không?`
  );
  if (!confirmed) {
    inventorySaving = false;
    return;
  }

  const payload = [];
  // Kiểm kê hôm nay phải có timestamp thực tế để Tồn Cuối cập nhật NGAY.
  // Nếu kiểm kê cho ngày đã qua, đặt timestamp ở cuối ngày đó để trở thành mốc tồn của ngày kế tiếp.
  const todayKey = localDateKey();
  const nowBase = date === todayKey
    ? Date.now()

  } catch (err) {
    inventorySaving = false;
    return showInventoryNotice('❌ KIỂM KÊ KHÔNG HOÀN TẤT', `${err.message || err}\n\nKhông có dữ liệu kiểm kê nào được coi là thành công.`);
  }
}

function initOrderingDrag() {
  const list = document.getElementById('orderingList');
  if (!list) return;
  let dragging = null, ghost = null, startY = 0, moved = false;
  const rows = () => [...list.querySelectorAll('.ordering-row')];
  const begin = (row, y) => {
    dragging = row; startY = y; moved = false;
    row.classList.add('dragging');
  };
  const move = (y, clientX) => {
    if (!dragging) return;
    if (Math.abs(y - startY) > 6) moved = true;
    if (!moved) return;
    const target = document.elementFromPoint(clientX, y)?.closest('.ordering-row');
    if (!target || target === dragging || !list.contains(target)) return;
    const rect = target.getBoundingClientRect();
    if (y < rect.top + rect.height / 2) list.insertBefore(dragging, target);
    else list.insertBefore(dragging, target.nextSibling);
    updateOrderingNumbers();
  };
  const end = () => {
    if (!dragging) return;
    dragging.classList.remove('dragging');
    dragging = null;
    updateOrderingNumbers();
  };
  rows().forEach(row => {
    row.addEventListener('touchstart', e => {
      if (e.touches.length !== 1) return;
      begin(row, e.touches[0].clientY);
    }, {passive:true});
    row.addEventListener('touchmove', e => {
      if (!dragging) return;
      const t=e.touches[0];
      if (moved || Math.abs(t.clientY-startY)>6) { e.preventDefault(); move(t.clientY,t.clientX); }
    }, {passive:false});
    row.addEventListener('touchend', end, {passive:true});
    row.addEventListener('touchcancel', end, {passive:true});
    row.addEventListener('mousedown', e => {
      if (e.button !== 0) return;
      begin(row, e.clientY);
      const mm = ev => move(ev.clientY, ev.clientX);
      const mu = () => { document.removeEventListener('mousemove',mm); document.removeEventListener('mouseup',mu); end(); };
      document.addEventListener('mousemove',mm);
      document.addEventListener('mouseup',mu);
    });
  });
}
function updateOrderingNumbers() {
  document.querySelectorAll('#orderingList .ordering-row').forEach((row,i)=>{
    const n=row.querySelector('.ordering-number'); if(n) n.textContent=i+1;
  });
}
async function saveOrdering() {
  if (!isOwnerRole()) return showInventoryNotice('⚠️ Không có quyền', 'Chỉ tài khoản Admin/Owner mới được sắp xếp mặt hàng.');

  const rows = [...document.querySelectorAll('#orderingList .ordering-row')];
  const old = arr.map(x => ({...x}));
  const changes = rows.map((row,i) => {
    const item = arr.find(x => x.id === row.dataset.id);
    if (!item) return null;
    const updated = {...item, sort_order:(i+1)*10};
    return {item, updated};
  }).filter(Boolean);
  try {
    for (const c of changes) await syncItemToSupabase(orderingTab, c.updated);
    changes.forEach(c => Object.assign(c.item, c.updated));
    saveLocalState();
    closeModal();
    render();
    showSuccessToast('Đã lưu thứ tự hiển thị');

    arr.forEach((x,i)=>Object.assign(x, old[i]));

  }
}
